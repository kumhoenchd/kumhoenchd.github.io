<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주택본부 수주검토 사업장 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#242A5C; --navy2:#1a1f42; --navy3:#2e3570;
  --orange:#F47F3F; --orange2:#e06a28;
  --pink:#FACECA; --sky:#C1DAF2; --beige:#F0D5BA;
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f0f4ff;
  --border:#dde3f0; --border2:#c8d0e8;
  --text:#1a1a2e; --text2:#4a5080; --text3:#8890b0;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
header{background:var(--navy);padding:0 28px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(36,42,92,0.3);}
.header-inner{height:72px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:20px;}
.kumho-logo{height:32px;object-fit:contain;filter:brightness(0) invert(1);}
.header-divider{width:1px;height:36px;background:rgba(255,255,255,0.25);}
.header-title{font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.header-right{display:flex;align-items:center;gap:10px;}
.save-badge{font-size:11px;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.1);}
.save-badge.ok{color:#7effc0;border-color:rgba(126,255,192,0.4);background:rgba(126,255,192,0.1);}
.save-badge.saving{color:#ffd97a;border-color:rgba(255,217,122,0.4);}

/* LAYOUT */
.app{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 72px);}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

/* SEARCH */
.search-area{padding:12px;border-bottom:1px solid var(--border);}
.search-wrap{position:relative;}
.search-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:9px 14px;border-radius:8px;outline:none;transition:all 0.15s;}
.search-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,42,92,0.1);}
.search-input::placeholder{color:var(--text3);}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;z-index:200;max-height:280px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(36,42,92,0.12);}
.search-results.show{display:block;}
.search-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--surface2);}
.search-item-name{font-size:12px;font-weight:600;color:var(--text);}
.search-item-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.search-item-addr{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* UPLOAD */
.upload-area{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);}
.upload-row{display:flex;gap:8px;}
.upload-btn{flex:1;padding:8px;border-radius:7px;border:1.5px dashed var(--border2);background:transparent;color:var(--text2);font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:center;position:relative;}
.upload-btn:hover{border-color:var(--navy);color:var(--navy);background:rgba(36,42,92,0.04);}
.upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;}
.template-btn{flex:1;padding:8px;border-radius:7px;border:1.5px solid var(--orange);background:transparent;color:var(--orange);font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:center;}
.template-btn:hover{background:var(--orange);color:white;}

/* TREE */
.tree-nav{flex:1;overflow-y:auto;padding:8px 0;}
.tree-nav::-webkit-scrollbar{width:3px;}
.tree-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.region-section{margin-bottom:1px;}
.region-header{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;transition:background 0.1s;border-radius:6px;margin:0 6px;}
.region-header:hover{background:var(--surface2);}
.region-header.active{background:rgba(36,42,92,0.08);border-left:2px solid var(--navy);}
.region-name{font-size:13px;font-weight:600;color:var(--text);}
.region-count{font-size:11px;color:var(--text3);background:var(--surface2);padding:1px 7px;border-radius:10px;border:1px solid var(--border);}
.region-chevron{font-size:10px;color:var(--text3);transition:transform 0.2s;}
.region-chevron.open{transform:rotate(90deg);}
.sub-list{display:none;padding:0 6px 4px;}
.sub-list.open{display:block;}
.sub-header{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;border-radius:6px;transition:background 0.1s;}
.sub-header:hover{background:var(--surface2);}
.sub-header.active{background:rgba(244,127,63,0.08);}
.sub-name{font-size:12px;font-weight:500;color:var(--text2);}
.sub-cnt{font-size:10px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:8px;}
.project-list{display:none;padding:0 6px 4px;}
.project-list.open{display:block;}
.project-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;cursor:pointer;border-radius:6px;transition:background 0.1s;border:1px solid transparent;margin-bottom:2px;}
.project-item:hover{background:var(--surface2);border-color:var(--border);}
.project-item.active{background:rgba(36,42,92,0.07);border-color:rgba(36,42,92,0.2);}
.project-year{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0;margin-top:1px;}
.y2026{background:rgba(232,0,29,0.1);color:#E8001D;}
.y2025{background:rgba(244,127,63,0.15);color:#d06020;}
.y2024{background:rgba(63,185,80,0.12);color:#2a8a3a;}
.project-info{flex:1;min-width:0;}
.project-name{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
.project-addr{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.project-actions{display:flex;gap:3px;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
.project-item:hover .project-actions{opacity:1;}
.icon-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.icon-btn:hover{border-color:var(--navy);color:var(--navy);}
.icon-btn.del:hover{border-color:#f85149;color:#f85149;}

/* SIDEBAR BOTTOM */
.sidebar-bottom{border-top:1px solid var(--border);padding:10px;}
.add-btn{width:100%;padding:10px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.add-btn:hover{background:var(--navy3);}

/* MAP */
.map-area{position:relative;overflow:hidden;background:#e8ecf4;}
#map{width:100%;height:100%;min-height:400px;}
.map-overlay{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10;transition:opacity 0.3s;}
.map-overlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay-text{font-size:13px;color:var(--text2);font-weight:500;}
.map-legend{position:absolute;bottom:20px;right:16px;background:rgba(255,255,255,0.95);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:11px;color:var(--text2);backdrop-filter:blur(8px);z-index:5;box-shadow:0 4px 16px rgba(36,42,92,0.1);}
.legend-title{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.legend-row:last-child{margin-bottom:0;}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.map-stat{font-size:11px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-backdrop.show{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:14px;padding:28px;width:520px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(36,42,92,0.2);}
.modal-title{font-size:17px;font-weight:700;color:var(--navy);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.form-row{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
.form-label .req{color:var(--orange);}
input[type="text"],input[type="date"],input[type="number"],select,textarea{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:8px 12px;border-radius:8px;outline:none;width:100%;transition:all 0.15s;}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,42,92,0.08);}
select option{background:var(--surface);}
.year-pills{display:flex;gap:6px;}
.year-pill{flex:1;padding:8px 0;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;color:var(--text2);}
.year-pill[data-year="2026"].selected{background:rgba(232,0,29,0.1);border-color:#E8001D;color:#E8001D;}
.year-pill[data-year="2025"].selected{background:rgba(244,127,63,0.12);border-color:var(--orange);color:var(--orange);}
.year-pill[data-year="2024"].selected{background:rgba(63,185,80,0.1);border-color:#3fb950;color:#3fb950;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px;border-top:1px solid var(--border);}
.btn{padding:9px 18px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;}
.btn:hover{border-color:var(--navy);color:var(--navy);}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy3);border-color:var(--navy3);}
.btn-danger{color:#f85149;border-color:#f85149;}
.btn-danger:hover{background:rgba(248,81,73,0.08);}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);border-radius:10px;padding:10px 18px;font-size:13px;color:#fff;z-index:9999;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;box-shadow:0 8px 24px rgba(36,42,92,0.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:#2a7d4f;}
.toast.err{background:#c0392b;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{max-height:45vh;}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
<img class="kumho-logo" src="data:image/png;base64,..." style="height:32px;object-fit:contain;background:white;padding:4px 8px;border-radius:6px;">
      <div class="header-divider"></div>
      <div class="header-title">주택본부 수주검토 사업장 현황</div>
    </div>
    <div class="header-right">
      <span class="save-badge" id="saveBadge">로딩 중...</span>
      <button class="btn" style="font-size:11px;padding:5px 10px;color:#f85149;border-color:rgba(248,81,73,0.4);background:rgba(248,81,73,0.1);" onclick="clearAll()">전체삭제</button>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <!-- 검색 -->
    <div class="search-area">
      <div class="search-wrap">
        <input class="search-input" type="text" id="searchInput" placeholder="🔍  사업장명, 주소 검색..." oninput="onSearch(this.value)" onblur="setTimeout(()=>hideSearch(),200)">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <!-- 엑셀 업로드 -->
    <div class="upload-area">
      <div class="upload-row">
        <label class="upload-btn">
          📂 엑셀 업로드
          <input type="file" accept=".xlsx,.xls,.csv" onchange="handleFile(event)">
        </label>
        <button class="template-btn" onclick="downloadTemplate()">⬇ 양식 다운로드</button>
      </div>
    </div>

    <!-- 지역 트리 -->
    <div class="tree-nav" id="treeNav"></div>

    <div class="sidebar-bottom">
      <button class="add-btn" onclick="openAdd()">＋ 사업장 추가</button>
    </div>
  </aside>

  <main class="map-area">
    <div id="mapOverlay" class="map-overlay">
      <div class="spinner"></div>
      <div class="overlay-text">지도 로딩 중...</div>
    </div>
    <div id="map"></div>
    <div class="map-legend" id="mapLegend" style="display:none;">
      <div class="legend-title">연도별 구분</div>
      <div class="legend-row"><div class="legend-dot" style="background:#E8001D"></div><span>2026년</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#F47F3F"></div><span>2025년</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:#3fb950"></div><span>2024년</span></div>
      <div class="map-stat" id="mapStat">표시: 0건</div>
    </div>
  </main>
</div>

<!-- 모달 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">사업장 추가</div>
    <input type="hidden" id="f-id">
    <div class="form-grid">
      <div class="form-row full">
        <label class="form-label">사업장명 <span class="req">*</span></label>
        <input type="text" id="f-name" placeholder="예: 서울 강남구 개포동 재건축">
      </div>
      <div class="form-row full">
        <label class="form-label">주소 <span class="req">*</span></label>
        <input type="text" id="f-addr" placeholder="예: 서울 강남구 개포동 123">
      </div>
      <div class="form-row">
        <label class="form-label">연도 <span class="req">*</span></label>
        <div class="year-pills">
          <button class="year-pill selected" data-year="2026" onclick="selectYear(this)">2026</button>
          <button class="year-pill" data-year="2025" onclick="selectYear(this)">2025</button>
          <button class="year-pill" data-year="2024" onclick="selectYear(this)">2024</button>
        </div>
        <input type="hidden" id="f-year" value="2026">
      </div>
      <div class="form-row">
        <label class="form-label">정보제공자</label>
        <input type="text" id="f-provider" placeholder="이름">
      </div>
      <div class="form-row">
        <label class="form-label">검토일자</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-row">
        <label class="form-label">대지면적 (㎡)</label>
        <input type="text" id="f-site" placeholder="예: 5,230">
      </div>
      <div class="form-row">
        <label class="form-label">연면적 (㎡)</label>
        <input type="text" id="f-floor" placeholder="예: 45,600">
      </div>
      <div class="form-row">
        <label class="form-label">층수</label>
        <input type="text" id="f-floors" placeholder="예: 35">
      </div>
      <div class="form-row">
        <label class="form-label">세대수</label>
        <input type="text" id="f-units" placeholder="예: 420">
      </div>
      <div class="form-row full">
        <label class="form-label">비고</label>
        <input type="text" id="f-memo" placeholder="투기과열지구, 역세권 등">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;margin-right:auto;" onclick="deleteFromModal()">삭제</button>
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="submitModal()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KAKAO_KEY = '9fb41d3d3cea04652d9876fe362aa0f3';

  '경상북도','경상남도','제주특별자치도'
];

let db = []; // flat array of projects
let allMarkers = [];
let kakaoMap = null, kakaoGeocoder = null, infowindow = null, kakaoReady = false;
let saveTimer = null, editingId = null;
let openRegion = null, openSub = null;

window.addEventListener('load', async () => { loadKakao(); await loadDb(); });

function loadKakao() {
  const s = document.createElement('script');
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&libraries=services&autoload=false`;
  s.onload = () => kakao.maps.load(() => {
    kakaoReady = true;
    kakaoMap = new kakao.maps.Map(document.getElementById('map'), {center:new kakao.maps.LatLng(36.5,127.5),level:12});
    kakaoGeocoder = new kakao.maps.services.Geocoder();
    infowindow = new kakao.maps.InfoWindow({zIndex:1});
    document.getElementById('mapOverlay').classList.add('hidden');
    document.getElementById('mapLegend').style.display = 'block';
    restoreMarkers();
  });
  document.head.appendChild(s);
}

async function loadDb() {
  try {
    const res = await fetch(DB_URL + '.json');
    const rec = await res.json();
    if (rec && rec.projects && Array.isArray(rec.projects)) {
      db = rec.projects;
    } else { db = []; }
  } catch(e) { db = []; }
  renderTree();
  setSaveBadge('ok', '동기화됨');
}

async function saveDb() {
  setSaveBadge('saving', '저장 중...');
  try {
    const clean = db.map(({id,name,addr,year,region,subregion,provider,date,site,floor,floors,units,memo,lat,lng}) =>
      ({id,name,addr,year,region:region||'',subregion:subregion||'',provider:provider||'',date:date||'',site:site||'',floor:floor||'',floors:floors||'',units:units||'',memo:memo||'',lat:lat||null,lng:lng||null}));
    const res = await fetch(DB_URL + '.json', {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({projects: clean})
    });
    if (!res.ok) throw new Error(res.status);
    setSaveBadge('ok', '저장됨 ✓');
  } catch(e) { setSaveBadge('', '저장 실패'); }
}

function debounceSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDb, 1200); }
function setSaveBadge(cls, txt) {
  const b = document.getElementById('saveBadge');
  b.className = 'save-badge' + (cls ? ' '+cls : '');
  b.textContent = txt;
}

// ── 지역 트리 ────────────────────────────────────────────────────────────
function getRegionTree() {
  const tree = {};
  db.forEach(item => {
    const r = item.region || '기타';
    const s = item.subregion || '기타';
    if (!tree[r]) tree[r] = {};
    if (!tree[r][s]) tree[r][s] = [];
    tree[r][s].push(item);
  });
  return tree;
}

function renderTree() {
  const nav = document.getElementById('treeNav');
  nav.innerHTML = '';
  const tree = getRegionTree();
  const regions = Object.keys(tree).sort((a,b) => {
    const ai = REGIONS.indexOf(a), bi = REGIONS.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });

  if (!regions.length) {
    nav.innerHTML = '<div style="padding:20px 16px;font-size:12px;color:var(--text3);text-align:center;">등록된 사업장이 없습니다</div>';
    return;
  }

  regions.forEach(region => {
    const subs = tree[region];
    const total = Object.values(subs).reduce((s,arr) => s+arr.length, 0);
    const isOpen = openRegion === region;
    const sec = document.createElement('div');
    sec.className = 'region-section';
    let subsHtml = '';
    Object.keys(subs).sort().forEach(sub => {
      const items = subs[sub];
      const isSubOpen = isOpen && openSub === sub;
      subsHtml += `<div>
        <div class="sub-header${isSubOpen?' active':''}" onclick="toggleSub('${esc(region)}','${esc(sub)}','${region}','${sub}')">
          <span class="sub-name">${sub}</span>
          <span class="sub-cnt">${items.length}</span>
        </div>
        <div class="project-list${isSubOpen?' open':''}" id="pl-${esc(region)}-${esc(sub)}">
          ${items.map(item => renderProjectItem(item)).join('')}
        </div>
      </div>`;
    });
    sec.innerHTML = `
      <div class="region-header${isOpen?' active':''}" onclick="toggleRegion('${esc(region)}','${region}')">
        <span class="region-name">${region}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="region-count">${total}</span>
          <span class="region-chevron${isOpen?' open':''}">▶</span>
        </div>
      </div>
      <div class="sub-list${isOpen?' open':''}" id="sl-${esc(region)}">${subsHtml}</div>`;
    nav.appendChild(sec);
  });
  updateStats();
}

function renderProjectItem(item) {
  const yc = item.year === '2026' ? 'y2026' : item.year === '2025' ? 'y2025' : 'y2024';
  return `<div class="project-item" id="pi-${item.id}" onclick="focusProject('${item.id}')">
    <div class="project-year ${yc}">${item.year}</div>
    <div class="project-info">
      <div class="project-name">${item.name}</div>
      <div class="project-addr">${item.addr}</div>
    </div>
    <div class="project-actions">
      <button class="icon-btn" onclick="event.stopPropagation();openEdit('${item.id}')" title="수정">✏</button>
      <button class="icon-btn del" onclick="event.stopPropagation();deleteItem('${item.id}')" title="삭제">✕</button>
    </div>
  </div>`;
}

function esc(s) { return s.replace(/[^a-zA-Z0-9가-힣]/g,'_'); }

function toggleRegion(escapedId, regionName) {
  openRegion = openRegion === regionName ? null : regionName;
  if (openRegion !== regionName) openSub = null;
  renderTree();
}

function toggleSub(eRegion, eSub, region, sub) {
  if (openRegion !== region) openRegion = region;
  openSub = (openRegion === region && openSub === sub) ? null : sub;
  renderTree();
  if (openSub) {
    const items = getRegionTree()[region]?.[sub] || [];
    if (items.length && kakaoReady) {
      const bounds = new kakao.maps.LatLngBounds();
      let count = 0;
      items.forEach(item => { if (item.lat && item.lng) { bounds.extend(new kakao.maps.LatLng(item.lat, item.lng)); count++; } });
      if (count > 0) kakaoMap.setBounds(bounds);
    }
  }
}

// ── 마커 ────────────────────────────────────────────────────────────────
function clearMarkers() { allMarkers.forEach(m => m && m.setMap && m.setMap(null)); allMarkers = []; }

function restoreMarkers() {
  if (!kakaoReady) return;
  clearMarkers();
  const bounds = new kakao.maps.LatLngBounds();
  let count = 0;
  db.forEach(item => {
    if (item.lat && item.lng) {
      const latlng = new kakao.maps.LatLng(item.lat, item.lng);
      placeMarker(item, latlng);
      bounds.extend(latlng);
      count++;
    }
  });
  if (count > 0) kakaoMap.setBounds(bounds);
  document.getElementById('mapStat').textContent = `표시: ${count}건`;
}

function placeMarker(item, latlng) {
const c = '#242A5C';
  const canvas = document.createElement('canvas');
canvas.width = 34; canvas.height = 42;
  const ctx = canvas.getContext('2d');
ctx.beginPath();
ctx.moveTo(17,40);
ctx.bezierCurveTo(17,40,2,26,2,15);
ctx.arc(17,15,15,Math.PI,0,false);
ctx.bezierCurveTo(32,26,17,40,17,40);
ctx.fillStyle = c;
ctx.fill();
ctx.strokeStyle='rgba(255,255,255,0.5)';
ctx.lineWidth=1.5;
ctx.stroke();
const imgObj = new Image();
imgObj.onload = function() {
    ctx.drawImage(imgObj, 0, 0, imgObj.width, imgObj.height*0.55, 4, 3, 26, 17);
    const mi = new kakao.maps.MarkerImage(canvas.toDataURL(), new kakao.maps.Size(34,42), {offset:new kakao.maps.Point(17,42)});
    const marker = new kakao.maps.Marker({position:latlng,map:kakaoMap,image:mi,title:item.name});
    kakao.maps.event.addListener(marker,'click',() => {
      infowindow.setContent(buildPopup(item));
      infowindow.open(kakaoMap,marker);
      highlightItem(item.id);
    });
    allMarkers.push(marker);
    item._marker = marker;
  };
  imgObj.src = ARTERA_IMG;
  item._latlng = latlng;
}

function buildPopup(item) {
  const c = YCLR[item.year]||'#242A5C';
  return `<div style="padding:14px 16px;min-width:240px;max-width:300px;font-family:Pretendard,sans-serif;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <div style="width:10px;height:10px;border-radius:50%;background:${c};flex-shrink:0;"></div>
      <strong style="font-size:13px;color:#1a1a2e;word-break:keep-all;">${item.name}</strong>
    </div>
    <div style="font-size:11px;color:#555;margin-bottom:6px;">${item.addr}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:11px;color:#666;">
      ${item.provider?`<div>📌 ${item.provider}</div>`:''}
      ${item.date?`<div>📅 ${item.date}</div>`:''}
      ${item.site?`<div>🏗 대지 ${item.site}㎡</div>`:''}
      ${item.floor?`<div>📐 연면적 ${item.floor}㎡</div>`:''}
      ${item.floors?`<div>🏢 ${item.floors}층</div>`:''}
      ${item.units?`<div>🏠 ${item.units}세대</div>`:''}
    </div>
    ${item.memo?`<div style="font-size:11px;color:#888;margin-top:6px;padding-top:6px;border-top:1px solid #eee;">${item.memo}</div>`:''}
    <div style="font-size:10px;color:#aaa;margin-top:6px;">${item.year}년 수주검토</div>
  </div>`;
}

function focusProject(id) {
  const item = db.find(i => i.id === id);
  if (!item || !item._latlng || !kakaoMap) return;
  kakaoMap.setCenter(item._latlng); kakaoMap.setLevel(4);
  if (item._marker) { infowindow.setContent(buildPopup(item)); infowindow.open(kakaoMap,item._marker); }
  highlightItem(id);
}

function highlightItem(id) {
  document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('pi-'+id);
  if (el) { el.classList.add('active'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

function updateStats() {
  const count = db.filter(i=>i.lat).length;
  const statEl = document.getElementById('mapStat');
  if (statEl) statEl.textContent = `표시: ${count}건`;
}

// ── 검색 ────────────────────────────────────────────────────────────────
function onSearch(q) {
  const box = document.getElementById('searchResults');
  if (!q.trim()) { box.classList.remove('show'); return; }
  const kw = q.toLowerCase();
  const results = db.filter(item =>
    item.name.toLowerCase().includes(kw) ||
    item.addr.toLowerCase().includes(kw) ||
    (item.region||'').toLowerCase().includes(kw) ||
    (item.subregion||'').toLowerCase().includes(kw) ||
    (item.memo||'').toLowerCase().includes(kw)
  );
  if (!results.length) {
    box.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--text3);text-align:center;">검색 결과 없음</div>';
    box.classList.add('show'); return;
  }
  box.innerHTML = results.slice(0,20).map(item => `
    <div class="search-item" onmousedown="selectSearchItem('${item.id}')">
      <div class="search-item-name">${item.name}</div>
      <div class="search-item-meta">${item.region||''} ${item.subregion||''} · ${item.year}년</div>
      <div class="search-item-addr">${item.addr}</div>
    </div>`).join('');
  box.classList.add('show');
}

function hideSearch() { document.getElementById('searchResults').classList.remove('show'); }
function selectSearchItem(id) {
  document.getElementById('searchInput').value = '';
  hideSearch();
  focusProject(id);
}

// ── 엑셀 업로드 ──────────────────────────────────────────────────────────
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      let added = 0;
      rows.forEach(row => {
        const name = String(row['사업장명*'] || row['사업장명'] || '').trim();
        const addr = String(row['주소*'] || row['주소'] || '').trim();
        const year = String(row['연도*'] || row['연도'] || '2026').trim();
        if (!name || !addr) return;
        const item = {
          id: Date.now().toString() + Math.random().toString(36).slice(2),
          name, addr,
          year: ['2026','2025','2024'].includes(year) ? year : '2026',
          region: String(row['시/도*'] || row['시도'] || '').trim(),
          subregion: String(row['시/군/구*'] || row['시군구'] || '').trim(),
          provider: String(row['정보제공자'] || '').trim(),
          date: String(row['검토일자'] || '').trim(),
          site: String(row['대지면적(㎡)'] || row['대지면적'] || '').trim(),
          floor: String(row['연면적(㎡)'] || row['연면적'] || '').trim(),
          floors: String(row['층수'] || '').trim(),
          units: String(row['세대수'] || '').trim(),
          memo: String(row['비고'] || '').trim(),
          lat: null, lng: null
        };
        db.push(item);
        added++;
        geocodeItem(item);
      });
      renderTree();
      debounceSave();
      showToast(`${added}건 업로드됨`, 'ok');
    } catch(err) { showToast('파일 오류: '+err.message, 'err'); }
  };
  reader.readAsArrayBuffer(file);
}

function downloadTemplate() {
  const a = document.createElement('a');
  a.href = XLSX_TEMPLATE;
  a.download = '수주검토_사업장_입력양식.xlsx';
  a.click();
}

// ── 지오코딩 ────────────────────────────────────────────────────────────
function geocodeItem(item, cb) {
  if (!kakaoReady) { setTimeout(() => geocodeItem(item, cb), 500); return; }
  kakaoGeocoder.addressSearch(item.addr, (result, status) => {
    if (status === kakao.maps.services.Status.OK) {
      item.lat = parseFloat(result[0].y);
      item.lng = parseFloat(result[0].x);
      item._latlng = new kakao.maps.LatLng(item.lat, item.lng);
      placeMarker(item, item._latlng);
      updateStats();
    }
    if (cb) cb(status === kakao.maps.services.Status.OK);
  });
}

// ── 모달 ────────────────────────────────────────────────────────────────
function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '사업장 추가';
  document.getElementById('deleteBtn').style.display = 'none';
  ['f-id','f-name','f-addr','f-provider','f-date','f-site','f-floor','f-floors','f-units','f-memo'].forEach(id => {
    document.getElementById(id).value = '';
  });
  selectYearVal('2026');
  document.getElementById('modal').classList.add('show');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function openEdit(id) {
  const item = db.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '사업장 수정';
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('f-id').value = id;
  document.getElementById('f-name').value = item.name || '';
  document.getElementById('f-addr').value = item.addr || '';
  document.getElementById('f-provider').value = item.provider || '';
  document.getElementById('f-date').value = item.date || '';
  document.getElementById('f-site').value = item.site || '';
  document.getElementById('f-floor').value = item.floor || '';
  document.getElementById('f-floors').value = item.floors || '';
  document.getElementById('f-units').value = item.units || '';
  document.getElementById('f-memo').value = item.memo || '';
  selectYearVal(item.year || '2026');
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function selectYear(el) {
  document.querySelectorAll('.year-pill').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('f-year').value = el.dataset.year;
}
function selectYearVal(y) {
  document.querySelectorAll('.year-pill').forEach(p => p.classList.toggle('selected', p.dataset.year === y));
  document.getElementById('f-year').value = y;
}

function getRegionFromAddr(addr) {
  for (const r of REGIONS) {
    const short = r.replace('특별시','').replace('광역시','').replace('특별자치시','').replace('도','').replace('특별자치도','');
    if (addr.startsWith(r) || addr.startsWith(short)) return r;
  }
  return '';
}

function submitModal() {
  const name = document.getElementById('f-name').value.trim();
  const addr = document.getElementById('f-addr').value.trim();
  const year = document.getElementById('f-year').value;
  if (!name) { showToast('사업장명을 입력해주세요','err'); return; }
  if (!addr) { showToast('주소를 입력해주세요','err'); return; }

  const region = getRegionFromAddr(addr);
  const subregion = addr.split(' ').slice(1,2).join(' ');

  if (editingId) {
    const idx = db.findIndex(i => i.id === editingId);
    if (idx >= 0) {
      const old = db[idx];
      if (old._marker) old._marker.setMap(null);
      db[idx] = { ...old, name, addr, year, region, subregion,
        provider: document.getElementById('f-provider').value.trim(),
        date: document.getElementById('f-date').value,
        site: document.getElementById('f-site').value.trim(),
        floor: document.getElementById('f-floor').value.trim(),
        floors: document.getElementById('f-floors').value.trim(),
        units: document.getElementById('f-units').value.trim(),
        memo: document.getElementById('f-memo').value.trim(),
        lat:null, lng:null, _marker:null, _latlng:null
      };
      geocodeItem(db[idx], ok => { renderTree(); debounceSave(); });
    }
  } else {
    const item = {
      id: Date.now().toString(),
      name, addr, year, region, subregion,
      provider: document.getElementById('f-provider').value.trim(),
      date: document.getElementById('f-date').value,
      site: document.getElementById('f-site').value.trim(),
      floor: document.getElementById('f-floor').value.trim(),
      floors: document.getElementById('f-floors').value.trim(),
      units: document.getElementById('f-units').value.trim(),
      memo: document.getElementById('f-memo').value.trim(),
      lat:null, lng:null
    };
    db.push(item);
    geocodeItem(item, ok => {
      if (ok) { kakaoMap.setCenter(item._latlng); kakaoMap.setLevel(5); showToast(`"${name}" 추가됨 ✓`,'ok'); }
      else showToast('주소를 찾을 수 없습니다','err');
      renderTree(); debounceSave();
    });
  }
  closeModal(); renderTree();
}

function deleteFromModal() {
  if (!editingId) return;
  deleteItem(editingId);
  closeModal();
}

function deleteItem(id) {
  const idx = db.findIndex(i => i.id === id);
  if (idx < 0) return;
  if (db[idx]._marker) db[idx]._marker.setMap(null);
  db.splice(idx, 1);
  renderTree(); updateStats(); debounceSave();
  showToast('삭제됐습니다','ok');
}

function clearAll() {
  if (!confirm('모든 데이터를 삭제할까요?')) return;
  db.forEach(i => { if (i._marker) i._marker.setMap(null); });
  db = [];
  renderTree(); updateStats(); saveDb();
  showToast('전체 삭제됐습니다','ok');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+type+' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
</script>
