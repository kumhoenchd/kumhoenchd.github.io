<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주택개발 수주검토 사업장 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#242A5C;--navy3:#2e3570;--orange:#F47F3F;
  --bg:#f0f4fb;--surface:#fff;--surface2:#f0f4ff;
  --border:#dde3f0;--text:#1a1a2e;--text2:#4a5080;--text3:#8890b0;
  --y2026:#c0001d;--y2025:#F47F3F;--y2024:#2a9d5c;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:#fff;border-bottom:3px solid var(--navy);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(36,42,92,0.08);}
.hi{height:66px;display:flex;align-items:center;justify-content:space-between;}
.hl{display:flex;align-items:center;gap:16px;}
.logo{height:30px;object-fit:contain;cursor:pointer;}
.hdiv{width:1px;height:32px;background:#ddd;}
.htitle{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-0.4px;}
.sbadge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text2);background:var(--surface2);}
.sbadge.ok{color:#2a7d4f;border-color:rgba(42,125,79,0.3);background:rgba(42,125,79,0.08);}
.sbadge.saving{color:#d29922;}
.app{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 69px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

/* 요약 카드 */
.summary{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface2);}
.sum-total{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px;}
.sum-row{display:flex;gap:6px;}
.sum-tag{flex:1;text-align:center;padding:4px 0;border-radius:6px;font-size:11px;font-weight:700;}
.sum-tag.s26{background:rgba(192,0,29,0.08);color:var(--y2026);}
.sum-tag.s25{background:rgba(244,127,63,0.12);color:var(--y2025);}
.sum-tag.s24{background:rgba(42,157,92,0.1);color:var(--y2024);}

/* Search */
.sa{padding:10px;border-bottom:1px solid var(--border);position:relative;}
.si{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:8px 12px;border-radius:8px;outline:none;}
.si:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,42,92,0.08);}
.si::placeholder{color:var(--text3);}
.sr{position:absolute;top:100%;left:10px;right:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:0 0 8px 8px;z-index:200;max-height:260px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(36,42,92,0.1);}
.sr.show{display:block;}
.sri{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
.sri:last-child{border-bottom:none;}
.sri:hover{background:var(--surface2);}
.sri-n{font-size:12px;font-weight:600;color:var(--text);}
.sri-m{font-size:11px;color:var(--text2);margin-top:1px;}
.sri-a{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
mark{background:#fff3a3;color:inherit;border-radius:2px;padding:0 1px;}

/* Upload */
.ua{padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;gap:8px;}
.ub{flex:1;padding:7px;border-radius:7px;border:1.5px dashed var(--border);background:transparent;color:var(--text2);font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;text-align:center;position:relative;overflow:hidden;}
.ub:hover{border-color:var(--navy);color:var(--navy);}
.ub input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.tb{flex:1;padding:7px;border-radius:7px;border:1.5px solid var(--orange);background:transparent;color:var(--orange);font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;}
.tb:hover{background:var(--orange);color:#fff;}
.eb{flex:1;padding:7px;border-radius:7px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;}
.eb:hover{background:var(--navy);color:#fff;}

/* 필터 태그 */
.fa{padding:6px 10px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;}
.fa.empty{display:none;}
.ft{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:4px;}
.ft button{background:none;border:none;color:#fff;cursor:pointer;font-size:12px;padding:0;line-height:1;}

/* 정렬 */
.sort-bar{padding:6px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.sort-lbl{font-size:11px;color:var(--text3);}
.sort-btn{font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-family:inherit;}
.sort-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}

/* Tree */
.tn{flex:1;overflow-y:auto;padding:6px 0;}
.tn::-webkit-scrollbar{width:3px;}
.tn::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.rh{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;border-radius:6px;margin:0 4px;border-left:2px solid transparent;user-select:none;}
.rh:hover{background:var(--surface2);}
.rh.open{background:rgba(36,42,92,0.06);border-left-color:var(--navy);}
.rh.filtered{background:rgba(36,42,92,0.1);border-left-color:var(--navy);}
.rn{font-size:13px;font-weight:600;color:var(--text);}
.rc{font-size:11px;color:var(--text3);background:var(--surface2);padding:1px 7px;border-radius:10px;border:1px solid var(--border);}
.rv{font-size:10px;color:var(--text3);transition:transform 0.2s;}
.rv.open{transform:rotate(90deg);}
.sl{display:none;padding:0 4px 2px;}
.sl.open{display:block;}
.sh{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;cursor:pointer;border-radius:6px;}
.sh:hover{background:var(--surface2);}
.sh.open{background:rgba(244,127,63,0.07);}
.sn{font-size:12px;font-weight:500;color:var(--text2);}
.sc{font-size:10px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:8px;}
.pl{display:none;padding:0 4px 2px;}
.pl.open{display:block;}
.pi{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;cursor:pointer;border-radius:6px;border:1px solid transparent;margin-bottom:1px;}
.pi:hover{background:var(--surface2);border-color:var(--border);}
.pi.active{background:rgba(36,42,92,0.06);border-color:rgba(36,42,92,0.2);}
.py{font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;flex-shrink:0;margin-top:1px;}
.y2026{background:rgba(192,0,29,0.1);color:#c0001d;}
.y2025{background:rgba(244,127,63,0.15);color:#c05010;}
.y2024{background:rgba(42,157,92,0.12);color:#1a6b3a;}
.pinfo{flex:1;min-width:0;}
.pname{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
.paddr{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.pacts{display:flex;gap:3px;opacity:0;flex-shrink:0;}
.pi:hover .pacts{opacity:1;}
.ib{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ib:hover{border-color:var(--navy);color:var(--navy);}
.ib.del:hover{border-color:#f85149;color:#f85149;}
.tip{padding:5px 12px;font-size:10px;color:var(--text3);background:var(--surface2);border-bottom:1px solid var(--border);}
.sb{border-top:1px solid var(--border);padding:10px;}
.ab{width:100%;padding:10px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;}
.ab:hover{background:var(--navy3);}

/* Map */
.ma{position:relative;overflow:hidden;}
#map{width:100%;height:100%;min-height:400px;}
.mo{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10;transition:opacity 0.3s;}
.mo.hidden{opacity:0;pointer-events:none;}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ot{font-size:13px;color:var(--text2);font-weight:500;}

/* Legend */
.leg{position:absolute;bottom:20px;right:16px;background:rgba(255,255,255,0.96);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:11px;z-index:5;box-shadow:0 4px 16px rgba(36,42,92,0.1);}
.lt{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.lr{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:4px 8px;border-radius:6px;border:2px solid transparent;cursor:pointer;}
.lr:hover{background:var(--surface2);}
.lr.on{border-color:currentColor;background:rgba(0,0,0,0.04);}
.lr:last-child{margin-bottom:0;}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.lc{font-weight:700;margin-left:2px;}

/* Modal */
.mb{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.mb.show{opacity:1;pointer-events:all;}
.md{background:var(--surface);border-radius:14px;padding:26px;width:520px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(36,42,92,0.18);}
.mt{font-size:17px;font-weight:700;color:var(--navy);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg .full{grid-column:1/-1;}
.fr{display:flex;flex-direction:column;gap:5px;}
.fl{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;}
.req{color:var(--orange);}
input[type=text],input[type=date],select{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:8px 11px;border-radius:8px;outline:none;width:100%;}
input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,42,92,0.08);}
.yps{display:flex;gap:6px;}
.yp{flex:1;padding:7px 0;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer;text-align:center;color:var(--text2);}
.yp[data-y="2026"].sel{background:rgba(192,0,29,0.08);border-color:#c0001d;color:#c0001d;}
.yp[data-y="2025"].sel{background:rgba(244,127,63,0.1);border-color:var(--orange);color:var(--orange);}
.yp[data-y="2024"].sel{background:rgba(42,157,92,0.1);border-color:#2a9d5c;color:#2a9d5c;}
.mac{display:flex;gap:8px;justify-content:flex-end;padding-top:4px;border-top:1px solid var(--border);}
.btn{padding:9px 18px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;}
.btn:hover{border-color:var(--navy);color:var(--navy);}
.btnp{background:var(--navy);border-color:var(--navy);color:#fff;}
.btnp:hover{background:var(--navy3);}
.btnd{color:#f85149;border-color:#f85149;}
.btnd:hover{background:rgba(248,81,73,0.07);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);border-radius:10px;padding:10px 18px;font-size:13px;color:#fff;z-index:9999;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:#2a7d4f;}
.toast.err{background:#c0392b;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{max-height:50vh;}}

.map-search{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;width:420px;max-width:calc(100% - 40px);}
.map-search input{flex:1;padding:10px 14px;border-radius:8px;border:none;font-family:'Pretendard',sans-serif;font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,0.15);outline:none;}
.map-search button{padding:10px 16px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.15);white-space:nowrap;}
.map-search button:hover{background:var(--navy3);}
.place-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);max-height:280px;overflow-y:auto;display:none;}
.place-results.show{display:block;}
.place-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0;}
.place-item:last-child{border-bottom:none;}
.place-item:hover{background:#f8f9ff;}
.place-item-name{font-size:13px;font-weight:600;color:#1a1a2e;}
.place-item-addr{font-size:11px;color:#666;margin-top:2px;}
.place-item-cat{font-size:10px;color:#aaa;margin-top:1px;}
</style>
</head>
<body>
<header>
  <div class="hi">
    <div class="hl">
      <img class="logo" src="kumho_logo.jpg" onclick="goHome()" title="홈으로">
      <div class="hdiv"></div>
      <div class="htitle">주택개발 수주검토 사업장 현황</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button id="adminBtn" onclick="toggleAdmin()" style="font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;">🔒 관리자</button>
      <span class="sbadge" id="sbadge">로딩 중...</span>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <!-- 요약 -->
    <div class="summary">
      <div class="sum-total" id="sumTotal">전체 0건</div>
      <div class="sum-row">
        <div class="sum-tag s26" id="sum26">2026년 0건</div>
        <div class="sum-tag s25" id="sum25">2025년 0건</div>
        <div class="sum-tag s24" id="sum24">2024년 0건</div>
      </div>
    </div>
    <!-- 검색 -->
    <div class="sa">
      <input class="si" type="text" id="si" placeholder="🔍  사업장명, 주소, 정보제공자 검색..." oninput="doSearch(this.value)" onblur="setTimeout(hideSearch,200)">
      <div class="sr" id="sr"></div>
    </div>
    <!-- 업로드 -->
    <div class="ua">
      <label class="ub">📂 업로드<input type="file" accept=".xlsx,.xls,.csv" onchange="handleFile(event)"></label>
      <button class="tb" onclick="dlTpl()">⬇ 양식</button>
      <button class="eb" onclick="exportExcel()">📤 내보내기</button>
    </div>
    <!-- 필터 태그 -->
    <div class="fa empty" id="fa"></div>
    <!-- 정렬 -->
    <div class="sort-bar">
      <span class="sort-lbl">정렬:</span>
      <button class="sort-btn on" id="srt-reg" onclick="setSort('region')">지역순</button>
      <button class="sort-btn" id="srt-new" onclick="setSort('new')">최신순</button>
      <button class="sort-btn" id="srt-yr" onclick="setSort('year')">연도순</button>
    </div>
    <div class="tip">💡 시/도명 더블클릭 → 지역 필터 적용</div>
    <div class="tn" id="tn"></div>
    <div class="sb"><button class="ab" onclick="openAdd()">＋ 사업장 추가</button></div>
  </aside>

  <main class="ma">
    <div class="map-search">
      <div style="position:relative;flex:1;">
        <input type="text" id="placeInput" placeholder="🔍  장소, 주소 검색..." onkeydown="if(event.key==='Enter')searchPlace()" oninput="if(!this.value)clearPlaceSearch()">
        <div class="place-results" id="placeResults"></div>
      </div>
      <button onclick="searchPlace()">검색</button>
    </div>
    <div id="mo" class="mo"><div class="spin"></div><div class="ot">지도 로딩 중...</div></div>
    <div id="map"></div>
    <div class="leg" id="leg" style="display:none;">
      <div class="lt">연도별 필터 (클릭)</div>
      <div class="lr" id="l26" onclick="toggleY('2026')" style="color:var(--y2026)"><div class="ld" style="background:var(--y2026)"></div><span>2026년</span><span class="lc" id="c26">0건</span></div>
      <div class="lr" id="l25" onclick="toggleY('2025')" style="color:var(--y2025)"><div class="ld" style="background:var(--y2025)"></div><span>2025년</span><span class="lc" id="c25">0건</span></div>
      <div class="lr" id="l24" onclick="toggleY('2024')" style="color:var(--y2024)"><div class="ld" style="background:var(--y2024)"></div><span>2024년</span><span class="lc" id="c24">0건</span></div>
    </div>
  </main>
</div>

<!-- 모달 -->
<div class="mb" id="modal">
  <div class="md">
    <div class="mt" id="mtitle">사업장 추가</div>
    <input type="hidden" id="fid">
    <div class="fg">
      <div class="fr full"><label class="fl">사업장명 <span class="req">*</span></label><input type="text" id="fname" placeholder="예: 서울 강남구 개포동 재건축"></div>
      <div class="fr full"><label class="fl">주소 <span class="req">*</span></label><input type="text" id="faddr" placeholder="예: 서울 강남구 개포동 123"></div>
      <div class="fr full">
        <label class="fl">연도 <span class="req">*</span></label>
        <div class="yps">
          <button class="yp sel" data-y="2026" onclick="selY(this)">2026</button>
          <button class="yp" data-y="2025" onclick="selY(this)">2025</button>
          <button class="yp" data-y="2024" onclick="selY(this)">2024</button>
        </div>
        <input type="hidden" id="fyear" value="2026">
      </div>
      <div class="fr"><label class="fl">정보제공자</label><input type="text" id="fprov" placeholder="이름"></div>
            <div class="fr"><label class="fl">정보제공일</label><input type="date" id="fdate"></div>
      <div class="fr"><label class="fl">검토부서</label><input type="text" id="fdept" placeholder="주택개발1팀 등"></div>
      <div class="fr"><label class="fl">대지면적 (㎡)</label><input type="text" id="fsite" placeholder="예: 5230"></div>
      <div class="fr"><label class="fl">연면적 (㎡)</label><input type="text" id="ffloor" placeholder="예: 45600"></div>
      <div class="fr"><label class="fl">층수</label><input type="text" id="ffloors" placeholder="예: 35"></div>
      <div class="fr"><label class="fl">세대수</label><input type="text" id="funits" placeholder="예: 420"></div>
      <div class="fr full"><label class="fl">비고</label><input type="text" id="fmemo" placeholder="투기과열지구, 역세권 등"></div>
    </div>
    <div class="mac">
      <button class="btn btnd admin-only" id="delbtn" style="display:none;margin-right:auto;" onclick="delFromModal()">삭제</button>
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btnp" onclick="submitModal()">저장</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9fb41d3d3cea04652d9876fe362aa0f3&libraries=services,clusterer&autoload=false"></script>

async function loadDb(){
  try{
    const r=await fetch(DU+'.json');
    const j=await r.json();
    db=(j&&j.projects)?j.projects.map(i=>({...i,_m:null,_ll:null})):[];
  }catch(e){db=[];}
  renderTree();updateStats();setSave('ok','동기화됨');
  if(ready) restoreMarkers();
}

async function saveDb(){
  setSave('saving','저장 중...');
  try{
    const c=db.map(({id,name,addr,year,region,subregion,provider,date,dept,site,floor,floors,units,memo,lat,lng})=>
      ({id,name,addr,year,region:region||'',subregion:subregion||'',provider:provider||'',date:date||'',dept:dept||'',site:site||'',floor:floor||'',floors:floors||'',units:units||'',memo:memo||'',lat:lat||null,lng:lng||null}));
    const r=await fetch(DU+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({projects:c})});

  }catch(e){setSave('','저장 실패');}
}

  if(el) el.classList.toggle('on',yf.has(y));

}
function toggleR(r){
  if(rf.has(r)) rf.delete(r); else rf.add(r);
  applyFilter();renderTags();renderTree();
}
function applyFilter(){
  const visMarkers=[];
  db.forEach(item=>{
    const yo=yf.size===0||yf.has(item.year);
    const ro=rf.size===0||rf.has(item.region);
    const show=yo&&ro;
    if(item._m){
      item._m.setMap(show?null:null); // clusterer로 관리
    }
  });
  // 클러스터러 재구성
  if(clusterer){
    clusterer.clear();
    const markers=[];
    db.forEach(item=>{
      const yo=yf.size===0||yf.has(item.year);
      const ro=rf.size===0||rf.has(item.region);
      if(item._m&&yo&&ro) markers.push(item._m);
    });
    clusterer.addMarkers(markers);
  }
}
function renderTags(){

  rf.forEach(r=>tags.push(`<div class="ft">${r} <button onclick="toggleR('${r}')">×</button></div>`));

// ── 트리 ──
function getTree(){
  const t={};
  let items=[...db];
  if(sortMode==='new') items=[...db].reverse();
  else if(sortMode==='year') items=[...db].sort((a,b)=>b.year.localeCompare(a.year));
  items.forEach(i=>{
    const r=i.region||'기타',s=i.subregion||'기타';
    if(!t[r]) t[r]={};
    if(!t[r][s]) t[r][s]=[];
    t[r][s].push(i);
  });
  return t;
}

function renderTree(){
  const nav=document.getElementById('tn');
  nav.innerHTML='';
  const tree=getTree();
  let regs=Object.keys(tree);
  if(sortMode==='region'||sortMode==='year'){
    regs=regs.sort((a,b)=>{
      const ai=RORD.indexOf(a),bi=RORD.indexOf(b);
      if(ai<0&&bi<0) return a.localeCompare(b,'ko');
      if(ai<0) return 1; if(bi<0) return -1; return ai-bi;
    });
  }
  if(!regs.length){nav.innerHTML='<div style="padding:20px;font-size:12px;color:var(--text3);text-align:center;">등록된 사업장이 없습니다</div>';return;}
  regs.forEach(reg=>{
    const subs=tree[reg];
    const total=Object.values(subs).reduce((s,a)=>s+a.length,0);
    const isOpen=oReg===reg,isFilt=rf.has(reg);
    const sec=document.createElement('div');
    let subsHtml='';
    let subKeys=Object.keys(subs);
    if(sortMode!=='new') subKeys=subKeys.sort((a,b)=>a.localeCompare(b,'ko'));
    subKeys.forEach(sub=>{
      const items=subs[sub],isSubOpen=isOpen&&oSub===sub;
      subsHtml+=`<div>
        <div class="sh${isSubOpen?' open':''}" onclick="toggleSub('${reg}','${sub}')">
          <span class="sn">${sub}</span><span class="sc">${items.length}</span>
        </div>
        <div class="pl${isSubOpen?' open':''}" id="pl${esc(reg+sub)}">
          ${items.map(i=>piHtml(i)).join('')}
        </div></div>`;
    });
    sec.innerHTML=`
      <div class="rh${isOpen?' open':''}${isFilt?' filtered':''}" onclick="toggleReg('${reg}')" ondblclick="event.stopPropagation();toggleR('${reg}')">
        <span class="rn">${reg}${isFilt?' ✓':''}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="rc">${total}</span>
          <span class="rv${isOpen?' open':''}">▶</span>
        </div>
      </div>
      <div class="sl${isOpen?' open':''}">${subsHtml}</div>`;
    nav.appendChild(sec);
  });
}

function hl(text,kw){
  if(!kw||!text) return text||'';
  return String(text).replace(new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'),'<mark>$1</mark>');
}

function piHtml(item){
  const yc=item.year==='2026'?'y2026':item.year==='2025'?'y2025':'y2024';
  const kw=searchKw;
  return `<div class="pi" id="pi${item.id}" onclick="focusItem('${item.id}')">
    <div class="py ${yc}">${item.year}</div>
    <div class="pinfo">
      <div class="pname">${hl(item.name,kw)}</div>
      <div class="paddr">${hl(item.addr,kw)}</div>
    </div>
    <div class="pacts admin-only" style="display:none;">
      <button class="ib" onclick="event.stopPropagation();openEdit('${item.id}')" title="수정">✏</button>
      <button class="ib del" onclick="event.stopPropagation();delItem('${item.id}')" title="삭제">✕</button>
    </div>
  </div>`;
}

function toggleReg(r){oReg=oReg===r?null:r;if(oReg!==r)oSub=null;renderTree();}
function toggleSub(r,s){
  if(oReg!==r) oReg=r;
  oSub=oSub===s?null:s;
  renderTree();
  if(oSub){
    const items=(getTree()[r]||{})[s]||[];
    if(items.length&&ready){
      const b=new kakao.maps.LatLngBounds();let c=0;
      items.forEach(i=>{if(i.lat&&i.lng){b.extend(new kakao.maps.LatLng(i.lat,i.lng));c++;}}); 
      if(c>0) map.setBounds(b);
    }
  }
}

// ── 마커 + 클러스터 ──
function restoreMarkers(){
  if(!ready) return;
  db.forEach(item=>{if(item._m){item._m.setMap(null);item._m=null;}}); 
  if(clusterer) clusterer.clear();
  const b=new kakao.maps.LatLngBounds();let c=0;
  const markers=[];
  db.forEach(item=>{
    if(item.lat&&item.lng){
      const ll=new kakao.maps.LatLng(item.lat,item.lng);
      item._ll=ll;
      const mk=makeMarker(item,ll);
      item._m=mk;
      markers.push(mk);
      b.extend(ll);c++;
    }
  });
  if(clusterer) clusterer.addMarkers(markers);
  if(c>0) map.setBounds(b);
  applyFilter();updateStats();
}

function makeMarker(item,ll){
  const c=YCLR[item.year]||'#242A5C';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="32" viewBox="0 0 24 32">
    <path d="M12 1C6.477 1 2 5.477 2 11c0 7.5 10 20 10 20S22 18.5 22 11C22 5.477 17.523 1 12 1z" fill="${c}" stroke="white" stroke-width="1.5"/>
    <circle cx="12" cy="11" r="4.5" fill="white"/>
  </svg>`;
  const src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
  const mi=new kakao.maps.MarkerImage(src,new kakao.maps.Size(24,32),{offset:new kakao.maps.Point(12,32)});
  const mk=new kakao.maps.Marker({position:ll,image:mi,title:item.name});
  kakao.maps.event.addListener(mk,'click',()=>{iw.setContent(buildPopup(item));iw.open(map,mk);hlItem(item.id);});
  return mk;
}

function toN(v){if(!v) return null;return parseFloat(String(v).replace(/,/g,''))||null;}
function toPy(s){const n=toN(s);if(!n) return null;return Math.round(n/3.305785*10)/10;}
function fN(n){if(n==null) return '';return Number(n).toLocaleString('ko-KR');}

function buildPopup(item){
  const c=YCLR[item.year]||'#242A5C';
  const sp=toPy(item.site),fp=toPy(item.floor);
  const rows=[
    item.provider?`<tr><td style="color:#888;white-space:nowrap;padding-right:10px;padding-bottom:3px;">정보제공자</td><td style="color:#333;font-weight:600;">${item.provider}</td></tr>`:'',

    item.units?`<tr><td style="color:#888;padding-right:10px;padding-bottom:3px;">세대수</td><td style="color:#333;">${fN(toN(item.units))}세대</td></tr>`:'',

    ${rows?`<table style="width:100%;font-size:12px;border-collapse:collapse;">${rows}</table>`:''}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:7px;">
      <span style="font-size:10px;color:#bbb;">${item.year}년 수주검토</span>
      <button onclick="map.setLevel(3);setTimeout(()=>{const pj=map.getProjection();const pt=pj.containerPointFromCoords(new kakao.maps.LatLng(${item.lat},${item.lng}));const nd=map.getNode();map.panBy(pt.x-nd.offsetWidth/2,pt.y-nd.offsetHeight/2-80);},300);" style="font-size:11px;padding:3px 8px;border:1px solid #ddd;border-radius:4px;background:#f5f5f5;cursor:pointer;color:#333;">🔍 확대</button>

      <div class="sri-a">${hl(i.addr,q)}</div>

// ── 엑셀 업로드 ──
function handleFile(e){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array',raw:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false});
      if(!rows.length){showToast('데이터가 없습니다','err');return;}
      let added=0;
      rows.forEach((row,idx)=>{
        // 모든 키를 소문자+특수문자제거로 정규화해서 매핑
        const norm={};
        Object.keys(row).forEach(k=>{norm[k.replace(/[*()\s㎡\/]/g,'').toLowerCase()]=String(row[k]||'').trim();});
        const gv=(...ks)=>{for(const k of ks){const v=norm[k.toLowerCase()];if(v) return v;}return '';};
        const name=gv('사업장명','name','사업장');
        const addr=gv('주소','address','addr');
        const year=gv('연도','year');
        if(!name||!addr){return;}
        const yr=['2026','2025','2024'].includes(year)?year:'2026';
        const item={
          id:Date.now().toString(36)+Math.random().toString(36).slice(2)+idx,
          name,addr,year:yr,
          region:gv('시도','시/도','region')||getRegion(addr),
          subregion:gv('시군구','시/군/구','subregion')||getSub(addr),
          provider:gv('정보제공자','provider','제공자'),
          date:gv('정보제공일','date','일자'),
          site:gv('대지면적','site'),
          floor:gv('연면적','floor'),
          floors:gv('층수','floors'),
          units:gv('세대수','units'),
          memo:gv('비고','memo','note'),
          lat:null,lng:null,_m:null,_ll:null
        };
        db.push(item);added++;
        geoItem(item);
      });
      renderTree();updateStats();debSave();
      showToast(`${added}건 업로드됨`,'ok');
    }catch(err){showToast('파일 오류: '+err.message,'err');console.error(err);}
  };
  reader.readAsArrayBuffer(file);
}

// ── 엑셀 내보내기 ──
function exportExcel(){
  if(!db.length){showToast('내보낼 데이터가 없습니다','err');return;}
  const headers=['사업장명','주소','연도','시도','시군구','정보제공자','정보제공일','대지면적','연면적','층수','세대수','비고'];
  const data=[headers,...db.map(i=>[i.name,i.addr,i.year,i.region,i.subregion,i.provider,i.date,i.site,i.floor,i.floors,i.units,i.memo])];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(data);
  ws['!cols']=[28,38,8,14,14,14,13,13,13,8,8,24].map(w=>(({wch:w})));
  XLSX.utils.book_append_sheet(wb,ws,'수주검토사업장');
  XLSX.writeFile(wb,`수주검토_사업장_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast(`${db.length}건 내보내기 완료`,'ok');
}

function dlTpl(){const a=document.createElement('a');a.href='수주검토_사업장_입력양식.xlsx';a.download='수주검토_사업장_입력양식.xlsx';a.click();}
  
// ── 지오코딩 ──
function geoItem(item,cb){
  if(!ready){setTimeout(()=>geoItem(item,cb),500);return;}
  gc.addressSearch(item.addr,(res,status)=>{
    if(status===kakao.maps.services.Status.OK){
      item.lat=parseFloat(res[0].y);item.lng=parseFloat(res[0].x);
      item._ll=new kakao.maps.LatLng(item.lat,item.lng);
      const mk=makeMarker(item,item._ll);
      item._m=mk;
      if(clusterer){
        const yo=yf.size===0||yf.has(item.year);
        const ro=rf.size===0||rf.has(item.region);
        if(yo&&ro) clusterer.addMarker(mk);
      }
      updateStats();
    }
    if(cb) cb(status===kakao.maps.services.Status.OK);
  });
}

// ── 모달 ──
function openAdd(){
  eid=null;
  document.getElementById('mtitle').textContent='사업장 추가';
  document.getElementById('delbtn').style.display='none';
  ['fid','fname','faddr','fprov','fdate','fdept','fsite','ffloor','ffloors','funits','fmemo'].forEach(id=>document.getElementById(id).value='');
  setY('2026');
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('fname').focus(),100);
}
function openEdit(id){
  if(!isAdmin){showToast('관리자만 수정할 수 있습니다','err');return;}
  const item=db.find(i=>i.id===id);if(!item) return;
  eid=id;
  document.getElementById('mtitle').textContent='사업장 수정';
  document.getElementById('delbtn').style.display='inline-flex';
  document.getElementById('fid').value=id;
  document.getElementById('fname').value=item.name||'';
  document.getElementById('faddr').value=item.addr||'';
  document.getElementById('fprov').value=item.provider||'';
  document.getElementById('fdate').value=item.date||'';
    document.getElementById('fdept').value=item.dept||'';
  document.getElementById('fsite').value=item.site||'';
  document.getElementById('ffloor').value=item.floor||'';
  document.getElementById('ffloors').value=item.floors||'';
  document.getElementById('funits').value=item.units||'';
  document.getElementById('fmemo').value=item.memo||'';
  setY(item.year||'2026');
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function selY(el){document.querySelectorAll('.yp').forEach(p=>p.classList.remove('sel'));el.classList.add('sel');document.getElementById('fyear').value=el.dataset.y;}
function setY(y){document.querySelectorAll('.yp').forEach(p=>p.classList.toggle('sel',p.dataset.y===y));document.getElementById('fyear').value=y;}

function submitModal(){
  const name=document.getElementById('fname').value.trim();
  const addr=document.getElementById('faddr').value.trim();
  const year=document.getElementById('fyear').value;
  if(!name){showToast('사업장명을 입력해주세요','err');return;}
  if(!addr){showToast('주소를 입력해주세요','err');return;}
  const region=getRegion(addr),subregion=getSub(addr);
  if(eid){
    const idx=db.findIndex(i=>i.id===eid);
    if(idx>=0){
      if(db[idx]._m){clusterer&&clusterer.removeMarker(db[idx]._m);db[idx]._m.setMap(null);}
      db[idx]={...db[idx],name,addr,year,region,subregion,
        provider:document.getElementById('fprov').value.trim(),
               date:document.getElementById('fdate').value,
               dept:document.getElementById('fdept').value.trim(),
        site:document.getElementById('fsite').value.trim(),
        floor:document.getElementById('ffloor').value.trim(),
        floors:document.getElementById('ffloors').value.trim(),
        units:document.getElementById('funits').value.trim(),
        memo:document.getElementById('fmemo').value.trim(),
        lat:null,lng:null,_m:null,_ll:null
      };
      geoItem(db[idx],ok=>{renderTree();updateStats();debSave();});
    }
  }else{
    const item={id:Date.now().toString(),name,addr,year,region,subregion,
      provider:document.getElementById('fprov').value.trim(),
                dept:document.getElementById('fdept').value.trim(),
      date:document.getElementById('fdate').value,
      site:document.getElementById('fsite').value.trim(),
      floor:document.getElementById('ffloor').value.trim(),
      floors:document.getElementById('ffloors').value.trim(),
      units:document.getElementById('funits').value.trim(),
      memo:document.getElementById('fmemo').value.trim(),
      lat:null,lng:null,_m:null,_ll:null
    };
    db.push(item);
    geoItem(item,ok=>{
      if(ok){map.setCenter(item._ll);map.setLevel(5);showToast(`"${name}" 추가됨 ✓`,'ok');}
      else showToast('주소를 찾을 수 없습니다','err');
      renderTree();updateStats();debSave();
    });
  }
  closeModal();renderTree();
}
function delFromModal(){if(!eid) return;delItem(eid);closeModal();}
function delItem(id){
  if(!isAdmin){showToast('관리자만 삭제할 수 있습니다','err');return;}
  const idx=db.findIndex(i=>i.id===id);if(idx<0) return;
  if(db[idx]._m){clusterer&&clusterer.removeMarker(db[idx]._m);db[idx]._m.setMap(null);}
  db.splice(idx,1);renderTree();updateStats();debSave();
  showToast('삭제됐습니다','ok');
}
function toggleAdmin(){
  if(isAdmin){
    isAdmin=false;applyAdminUI();showToast('관리자 모드 해제','ok');
  }else{
    const pw=prompt('관리자 비밀번호를 입력하세요:');
    if(pw===ADMIN_PW){isAdmin=true;applyAdminUI();showToast('관리자 모드 활성화 ✓','ok');}
    else if(pw!==null) showToast('비밀번호가 틀렸습니다','err');
  }
}
function applyAdminUI(){
  const btn=document.getElementById('adminBtn');
  if(!btn) return;
  if(isAdmin){
    btn.innerHTML='🔓 관리자';btn.style.color='#2a7d4f';
    btn.style.borderColor='rgba(42,125,79,0.4)';btn.style.background='rgba(42,125,79,0.08)';
  }else{
    btn.innerHTML='🔒 관리자';btn.style.color='';btn.style.borderColor='';btn.style.background='';
  }
  document.querySelectorAll('.admin-only').forEach(el=>{el.style.display=isAdmin?'':'none';});
}
function goHome(){
  iw&&iw.close();oReg=null;oSub=null;
  yf.clear();rf.clear();
  renderTags();
  ['l26','l25','l24'].forEach(id=>{const e=document.getElementById(id);if(e)e.classList.remove('on');});
  renderTree();restoreMarkers();
}

let placeMarkers=[];

function searchPlace(){
  const q=document.getElementById('placeInput').value.trim();
  if(!q) return;
  const REST_KEY='6f377295518df4dcaa4835f962c5b5bc';
  // 1차: 키워드 검색
  fetch(`https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(q)}&size=8`,{
    headers:{'Authorization':'KakaoAK '+REST_KEY}
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.documents&&data.documents.length>0){
      showPlaceResults(data.documents);
    } else {
      // 2차: 주소 검색
      fetch(`https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(q)}&size=8`,{
        headers:{'Authorization':'KakaoAK '+REST_KEY}
      })
      .then(r=>r.json())
      .then(data2=>{
        if(data2.documents&&data2.documents.length>0){
          // 주소 결과를 장소 형태로 변환
          const places=data2.documents.map(d=>({
            place_name:d.address_name,
            road_address_name:d.road_address?d.road_address.address_name:'',
            address_name:d.address_name,
            x:d.x, y:d.y,
            category_group_name:'주소',
            phone:'', place_url:''
          }));
          showPlaceResults(places);
        } else {
          // 3차: Geocoder fallback
          gc.addressSearch(q,(result,status)=>{
            if(status===kakao.maps.services.Status.OK){
              addPlaceMarker({place_name:q,road_address_name:result[0].address_name,address_name:result[0].address_name,x:result[0].x,y:result[0].y});
            } else showToast('검색 결과가 없습니다','err');
          });
        }
      });
    }
  })
  .catch(()=>{
    gc.addressSearch(q,(result,status)=>{
      if(status===kakao.maps.services.Status.OK){
        addPlaceMarker({place_name:q,road_address_name:result[0].address_name,address_name:result[0].address_name,x:result[0].x,y:result[0].y});
      } else showToast('검색 결과가 없습니다','err');
    });
  });
}

function showPlaceResults(places){
  const box=document.getElementById('placeResults');
  box.innerHTML=places.map((p,i)=>`
    <div class="place-item" onclick="selectPlace(${i})">
      <div class="place-item-name">${p.place_name}</div>
      <div class="place-item-addr">${p.road_address_name||p.address_name}</div>
      <div class="place-item-cat">${p.category_group_name||''}</div>
    </div>`).join('');
  box.dataset.places=JSON.stringify(places);
  box.classList.add('show');
}

function selectPlace(idx){
  const places=JSON.parse(document.getElementById('placeResults').dataset.places||'[]');
  const p=places[idx]; if(!p) return;
  document.getElementById('placeResults').classList.remove('show');
  addPlaceMarker(p);
}

function addPlaceMarker(p){
  clearPlaceMarkers();
  const ll=new kakao.maps.LatLng(p.y,p.x);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
    <path d="M14 1C7.925 1 3 5.925 3 12c0 8.25 11 23 11 23S25 20.25 25 12C25 5.925 20.075 1 14 1z" fill="#1D6FE8" stroke="white" stroke-width="1.5"/>
    <circle cx="14" cy="12" r="5" fill="white"/></svg>`;
  const mi=new kakao.maps.MarkerImage('data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg))),new kakao.maps.Size(28,36),{offset:new kakao.maps.Point(14,36)});
  const mk=new kakao.maps.Marker({position:ll,map:map,image:mi,title:p.place_name});
  const popup=`<div style="padding:10px 14px;min-width:200px;max-width:260px;font-family:'Pretendard',sans-serif;">
    <div style="font-size:13px;font-weight:700;color:#1a1a2e;margin-bottom:4px;">${p.place_name}</div>
    <div style="font-size:11px;color:#555;margin-bottom:3px;">${p.road_address_name||p.address_name||''}</div>
    ${p.category_group_name?`<div style="font-size:10px;color:#888;">${p.category_group_name}</div>`:''}
    ${p.phone?`<div style="font-size:11px;color:#666;margin-top:3px;">📞 ${p.phone}</div>`:''}
    ${p.place_url?`<a href="${p.place_url}" target="_blank" style="font-size:11px;color:var(--navy);margin-top:5px;display:inline-block;">카카오맵에서 보기 →</a>`:''}
  </div>`;
  iw.setContent(popup);iw.open(map,mk);
  placeMarkers.push(mk);
  map.setCenter(ll);map.setLevel(4);
}

function clearPlaceMarkers(){placeMarkers.forEach(m=>m.setMap(null));placeMarkers=[];iw.close();}
function clearPlaceSearch(){document.getElementById('placeResults').classList.remove('show');clearPlaceMarkers();}

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2500);
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal')) closeModal();});
</script>
