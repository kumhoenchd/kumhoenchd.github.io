<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주택본부 수주검토 사업장 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#1c2128; --surface3:#22272e;
  --border:#30363d; --border2:#21262d;
  --text:#e6edf3; --text2:#8b949e; --text3:#484f58;
  --red:#E8001D; --red2:#ff1a35; --red-glow:rgba(232,0,29,0.15);
  --y2026:#E8001D; --y2025:#f59e0b; --y2024:#3fb950;
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

header{background:#fff;border-bottom:2px solid var(--red);padding:0 24px;position:sticky;top:0;z-index:100;}
.header-top{height:64px;display:flex;align-items:center;justify-content:space-between;}
.logo-area{display:flex;align-items:center;gap:16px;}
.header-divider{width:1px;height:32px;background:#ddd;}
.header-titles{display:flex;flex-direction:column;gap:2px;}
.header-title{font-size:15px;font-weight:700;color:#1a1a2e;letter-spacing:-0.3px;}
.header-sub{font-size:11px;color:#666;}
.header-right{display:flex;align-items:center;gap:8px;}
.save-badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid #ddd;color:#666;background:#f5f5f5;}
.save-badge.ok{color:#2a9d5c;border-color:rgba(42,157,92,0.3);background:rgba(42,157,92,0.08);}
.save-badge.saving{color:#d29922;border-color:rgba(210,153,34,0.3);}

/* 아테라 심벌만 표시 (위쪽 절반만) */
.artera-symbol{
  overflow:hidden;
  height:40px;
  width:46px;
  flex-shrink:0;
  position:relative;
}
.artera-symbol img{
  position:absolute;
  height:80px;
  top:-2px;
  left:-13px;
  object-fit:none;
  object-position:top center;
}

.search-bar{padding:8px 0 10px;}
.search-wrap{position:relative;}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:8px 12px 8px 36px;border-radius:6px;outline:none;transition:border-color 0.15s;}
.search-input:focus{border-color:var(--red);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:200;max-height:280px;overflow-y:auto;display:none;}
.search-results.show{display:block;}
.search-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border2);transition:background 0.1s;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--surface2);}
.search-item-name{font-size:12px;font-weight:600;color:var(--text);}
.search-item-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.search-item-addr{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.app{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 66px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.tree-nav{flex:1;overflow-y:auto;padding:8px 0;}
.tree-nav::-webkit-scrollbar{width:3px;}
.tree-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.team-section{margin-bottom:2px;}
.team-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;transition:background 0.1s;border-radius:6px;margin:0 6px;}
.team-header:hover{background:var(--surface2);}
.team-header.active{background:var(--red-glow);border-left:2px solid var(--red);}
.team-name{font-size:13px;font-weight:600;color:var(--text);}
.team-count{font-size:11px;color:var(--text3);background:var(--surface3);padding:1px 7px;border-radius:10px;}
.team-chevron{font-size:10px;color:var(--text3);transition:transform 0.2s;}
.team-chevron.open{transform:rotate(90deg);}
.year-list{display:none;padding:0 6px 4px;}
.year-list.open{display:block;}
.year-row{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;cursor:pointer;border-radius:6px;transition:background 0.1s;}
.year-row:hover{background:var(--surface2);}
.year-row.active{background:var(--surface3);}
.year-dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.year-label{font-size:12px;font-weight:500;display:flex;align-items:center;}
.year-cnt{font-size:10px;color:var(--text3);background:var(--surface3);padding:1px 6px;border-radius:8px;}
.project-list{display:none;padding:0 6px 4px;}
.project-list.open{display:block;}
.project-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;cursor:pointer;border-radius:6px;transition:background 0.1s;border:1px solid transparent;margin-bottom:2px;}
.project-item:hover{background:var(--surface2);border-color:var(--border2);}
.project-item.active{background:var(--red-glow);border-color:rgba(232,0,29,0.25);}
.project-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.project-info{flex:1;min-width:0;}
.project-name{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
.project-addr{font-size:10px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}
.project-memo{font-size:10px;color:var(--text3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
.project-actions{display:flex;gap:3px;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
.project-item:hover .project-actions{opacity:1;}
.icon-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.icon-btn:hover{border-color:#3b82f6;color:#3b82f6;}
.icon-btn.del:hover{border-color:#f85149;color:#f85149;}
.sidebar-bottom{border-top:1px solid var(--border);padding:10px;}
.add-btn{width:100%;padding:9px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--text2);font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.add-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-glow);}
.map-area{position:relative;overflow:hidden;background:var(--bg);}
#map{width:100%;height:100%;min-height:400px;}
.map-overlay{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10;transition:opacity 0.3s;}
.map-overlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:32px;height:32px;border:2.5px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay-text{font-size:13px;color:var(--text2);}
.map-legend{position:absolute;bottom:20px;right:16px;background:rgba(10,10,10,0.92);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--text2);backdrop-filter:blur(8px);z-index:5;}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.legend-row:last-child{margin-bottom:0;}
.legend-dot{width:8px;height:8px;border-radius:50%;}
.map-stat{font-size:11px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border2);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-backdrop.show{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:360px;display:flex;flex-direction:column;gap:14px;}
.modal-title{font-size:15px;font-weight:700;}
.form-row{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;}
input[type="text"],select{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:8px 11px;border-radius:6px;outline:none;width:100%;transition:border-color 0.15s,box-shadow 0.15s;}
input:focus,select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-glow);}
select option{background:var(--surface2);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:2px;}
.btn{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:all 0.15s;}
.btn:hover{border-color:#3b82f6;color:#3b82f6;}
.btn-primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn-primary:hover{background:var(--red2);border-color:var(--red2);color:#fff;}
.btn-danger{color:#f85149;border-color:#f85149;}
.btn-danger:hover{background:rgba(248,81,73,0.1);}
.year-pills{display:flex;gap:6px;}
.year-pill{flex:1;padding:7px 0;border-radius:6px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;text-align:center;transition:all 0.15s;}
.year-pill[data-year="2026"]{color:var(--y2026);}
.year-pill[data-year="2025"]{color:var(--y2025);}
.year-pill[data-year="2024"]{color:var(--y2024);}
.year-pill.selected[data-year="2026"]{background:rgba(232,0,29,0.15);border-color:var(--y2026);}
.year-pill.selected[data-year="2025"]{background:rgba(245,158,11,0.15);border-color:var(--y2025);}
.year-pill.selected[data-year="2024"]{background:rgba(63,185,80,0.15);border-color:var(--y2024);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 16px;font-size:12px;color:var(--text);z-index:9999;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{border-color:rgba(63,185,80,0.4);}
.toast.err{border-color:rgba(248,81,73,0.4);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{max-height:45vh;}}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo-area">
      <!-- 금호건설 로고 원본 -->
      <img src="금호건설(국문)_B.jpg" style="height:34px;object-fit:contain;">
      <div class="header-divider"></div>
      <!-- 아테라 심벌만 (위쪽 절반 crop) -->
      <div class="artera-symbol">
        <img src="ARTERA_시그니처_네이비.png">
      </div>
      <div class="header-divider"></div>
      <div class="header-titles">
        <div class="header-title">주택본부 수주검토 사업장 현황</div>
        <div class="header-sub">금호건설 주택본부</div>
      </div>
    </div>
    <div class="header-right">
      <span class="save-badge" id="saveBadge">로딩 중...</span>
      <button class="btn" style="font-size:11px;padding:5px 10px;color:#f85149;border-color:#f85149;" onclick="clearAll()">전체삭제</button>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div style="padding:10px 10px 0;position:relative;">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" id="searchInput" placeholder="사업장 검색... (예: 청주, 재건축)" oninput="onSearch(this.value)" onblur="setTimeout(()=>hideSearch(),200)">
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
    <div class="tree-nav" id="treeNav"></div>
    <div class="sidebar-bottom">
      <button class="add-btn" onclick="openAdd()">＋ 사업장 추가</button>
    </div>
  </aside>

  <main class="map-area">
    <div id="mapOverlay" class="map-overlay">
      <div class="spinner"></div>
      <div class="overlay-text">지도 로딩 중...</div>
    </div>
    <div id="map"></div>
    <div class="map-legend" id="mapLegend" style="display:none;">
      <div class="legend-row"><div class="legend-dot" style="background:var(--y2026)"></div><span>2026년</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:var(--y2025)"></div><span>2025년</span></div>
      <div class="legend-row"><div class="legend-dot" style="background:var(--y2024)"></div><span>2024년</span></div>
      <div class="map-stat" id="mapStat">표시: 0건</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">사업장 추가</div>
    <input type="hidden" id="f-id">
    <div class="form-row">
      <label class="form-label">팀</label>
      <select id="f-team">
        <option>주택개발1팀</option>
        <option>주택개발2팀</option>
        <option>공모개발팀</option>
        <option>도시정비1팀</option>
        <option>도시정비2팀</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label">연도</label>
      <div class="year-pills">
        <button class="year-pill selected" data-year="2026" onclick="selectYear(this)">2026</button>
        <button class="year-pill" data-year="2025" onclick="selectYear(this)">2025</button>
        <button class="year-pill" data-year="2024" onclick="selectYear(this)">2024</button>
      </div>
      <input type="hidden" id="f-year" value="2026">
    </div>
    <div class="form-row">
      <label class="form-label">사업장명 *</label>
      <input type="text" id="f-name" placeholder="예: 청주 테크노폴리스 재건축">
    </div>
    <div class="form-row">
      <label class="form-label">주소 *</label>
      <input type="text" id="f-addr" placeholder="예: 충북 청주시 흥덕구 옥산면" onkeydown="if(event.key==='Enter')submitModal()">
    </div>
    <div class="form-row">
      <label class="form-label">메모</label>
      <input type="text" id="f-memo" placeholder="규모, 세대수 등">
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;margin-right:auto;" onclick="deleteFromModal()">삭제</button>
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="submitModal()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KAKAO_KEY = '9fb41d3d3cea04652d9876fe362aa0f3';
const DB_URL = 'https://kumhoenchd-default-rtdb.asia-southeast1.firebasedatabase.app/data';
const TEAMS  = ['주택개발1팀','주택개발2팀','공모개발팀','도시정비1팀','도시정비2팀'];
const YEARS  = ['2026','2025','2024'];
const YCLR   = { '2026':'#E8001D', '2025':'#f59e0b', '2024':'#3fb950' };
let db = {}, allMarkers = [];
let kakaoMap = null, kakaoGeocoder = null, infowindow = null, kakaoReady = false;
let saveTimer = null, openTeam = null, openYear = null, editingId = null;

function emptyDb() {
  const d = {};
  TEAMS.forEach(t => { d[t] = {}; YEARS.forEach(y => d[t][y] = []); });
  return d;
}

window.addEventListener('load', async () => { loadKakao(); await loadDb(); });

function loadKakao() {
  const s = document.createElement('script');
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&libraries=services&autoload=false`;
  s.onload = () => kakao.maps.load(() => {
    kakaoReady = true;
    kakaoMap = new kakao.maps.Map(document.getElementById('map'), { center: new kakao.maps.LatLng(37.5,127.0), level:12 });
    kakaoGeocoder = new kakao.maps.services.Geocoder();
    infowindow = new kakao.maps.InfoWindow({ zIndex:1 });
    document.getElementById('mapOverlay').classList.add('hidden');
    document.getElementById('mapLegend').style.display = 'block';
    restoreMarkers();
  });
  document.head.appendChild(s);
}

async function loadDb() {
  try {
    const res = await fetch(DB_URL + '.json');
    const rec = await res.json();
    if (rec && rec.teams) {
      db = {};
      TEAMS.forEach(t => {
        db[t] = {};
        YEARS.forEach(y => {
          db[t][y] = (rec.teams[t]?.[y] || []).map(item => ({
            id: item.id, name: item.name, addr: item.addr,
            memo: item.memo || '', lat: item.lat || null, lng: item.lng || null,
            _marker: null, _latlng: null
          }));
        });
      });
    } else { db = emptyDb(); }
  } catch(e) { db = emptyDb(); }
  renderTree();
  setSaveBadge('ok', '동기화됨');
}

async function saveDb() {
  setSaveBadge('saving', '저장 중...');
  try {
    const clean = {};
    TEAMS.forEach(t => {
      clean[t] = {};
      YEARS.forEach(y => {
        clean[t][y] = (db[t]?.[y]||[]).map(({id,name,addr,memo,lat,lng}) => ({id,name,addr,memo:memo||'',lat:lat||null,lng:lng||null}));
      });
    });
    const res = await fetch(DB_URL + '.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teams: clean })
    });
    if (!res.ok) throw new Error(res.status);
    setSaveBadge('ok', '저장됨 ✓');
  } catch(e) { setSaveBadge('', '저장 실패'); }
}

function debounceSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDb, 1200); }
function setSaveBadge(cls, txt) {
  const b = document.getElementById('saveBadge');
  b.className = 'save-badge' + (cls ? ' '+cls : '');
  b.textContent = txt;
}

function onSearch(q) {
  const box = document.getElementById('searchResults');
  if (!q.trim()) { box.classList.remove('show'); return; }
  const kw = q.toLowerCase();
  const results = [];
  TEAMS.forEach(team => YEARS.forEach(year => {
    (db[team]?.[year]||[]).forEach(item => {
      if (item.name.toLowerCase().includes(kw) || item.addr.toLowerCase().includes(kw) || (item.memo||'').toLowerCase().includes(kw)) {
        results.push({ item, team, year });
      }
    });
  }));
  if (!results.length) {
    box.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--text3);text-align:center;">검색 결과 없음</div>';
    box.classList.add('show'); return;
  }
  box.innerHTML = results.map(({item,team,year}) => `
    <div class="search-item" onmousedown="selectSearchItem('${item.id}','${team}','${year}')">
      <div class="search-item-name">${item.name}</div>
      <div class="search-item-meta">${team} · ${year}년</div>
      <div class="search-item-addr">${item.addr}</div>
    </div>`).join('');
  box.classList.add('show');
}

function hideSearch() { document.getElementById('searchResults').classList.remove('show'); }
function selectSearchItem(id, team, year) {
  document.getElementById('searchInput').value = '';
  hideSearch();
  focusProject(id, team, year);
}

function renderTree() {
  const nav = document.getElementById('treeNav');
  nav.innerHTML = '';
  TEAMS.forEach(team => {
    const total = YEARS.reduce((s,y) => s + (db[team]?.[y]?.length||0), 0);
    const isOpen = openTeam === team;
    const sec = document.createElement('div');
    sec.className = 'team-section';
    sec.innerHTML = `
      <div class="team-header${isOpen?' active':''}" onclick="toggleTeam('${team}')">
        <span class="team-name">${team}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="team-count">${total}</span>
          <span class="team-chevron${isOpen?' open':''}">▶</span>
        </div>
      </div>
      <div class="year-list${isOpen?' open':''}" id="year-${esc(team)}">
        ${YEARS.map(year => {
          const cnt = db[team]?.[year]?.length || 0;
          const isYOpen = isOpen && openYear === year;
          return `<div>
            <div class="year-row${isYOpen?' active':''}" onclick="toggleYear('${team}','${year}')">
              <div class="year-label"><div class="year-dot" style="background:${YCLR[year]}"></div>${year}년</div>
              <span class="year-cnt">${cnt}</span>
            </div>
            <div class="project-list${isYOpen?' open':''}" id="proj-${esc(team)}-${year}">
              ${renderProjects(team, year)}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    nav.appendChild(sec);
  });
}

function renderProjects(team, year) {
  const items = db[team]?.[year] || [];
  if (!items.length) return `<div style="padding:6px 12px;font-size:11px;color:var(--text3);">등록된 사업장 없음</div>`;
  return items.map(item => `
    <div class="project-item" id="pi-${item.id}" onclick="focusProject('${item.id}','${team}','${year}')">
      <div class="project-dot" style="background:${YCLR[year]}"></div>
      <div class="project-info">
        <div class="project-name">${item.name}</div>
        <div class="project-addr">${item.addr}</div>
        ${item.memo?`<div class="project-memo">${item.memo}</div>`:''}
      </div>
      <div class="project-actions">
        <button class="icon-btn" onclick="event.stopPropagation();openEdit('${item.id}','${team}','${year}')" title="수정">✏</button>
        <button class="icon-btn del" onclick="event.stopPropagation();deleteProject('${item.id}','${team}','${year}')" title="삭제">✕</button>
      </div>
    </div>`).join('');
}

function esc(s) { return s.replace(/[^a-zA-Z0-9가-힣]/g,'_'); }

function toggleTeam(team) {
  openTeam = openTeam === team ? null : team;
  if (openTeam !== team) openYear = null;
  renderTree();
}

function toggleYear(team, year) {
  if (openTeam !== team) openTeam = team;
  openYear = (openTeam === team && openYear === year) ? null : year;
  renderTree();
  if (openYear) showTeamYearOnMap(team, year);
}

function clearMarkers() { allMarkers.forEach(m => m.marker && m.marker.setMap(null)); allMarkers = []; }

function restoreMarkers() {
  if (!kakaoReady) return;
  clearMarkers();
  const bounds = new kakao.maps.LatLngBounds();
  let count = 0;
  TEAMS.forEach(team => YEARS.forEach(year => {
    (db[team]?.[year]||[]).forEach(item => {
      if (item.lat && item.lng) {
        const latlng = new kakao.maps.LatLng(item.lat, item.lng);
        placeMarker(item, year, latlng); bounds.extend(latlng); count++;
      }
    });
  }));
  if (count > 0) kakaoMap.setBounds(bounds);
  document.getElementById('mapStat').textContent = `표시: ${count}건`;
}

function showTeamYearOnMap(team, year) {
  if (!kakaoReady) return;
  restoreMarkers();
  const items = (db[team]?.[year]||[]).filter(i => i.lat && i.lng);
  if (!items.length) return;
  const bounds = new kakao.maps.LatLngBounds();
  items.forEach(item => bounds.extend(new kakao.maps.LatLng(item.lat, item.lng)));
  kakaoMap.setBounds(bounds);
}

function placeMarker(item, year, latlng) {
  const c = YCLR[year] || '#E8001D';
  // 아테라 심벌 모양 마커 (집+A자)
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">
    <path d="M18 0C8.059 0 0 8.059 0 18c0 11.25 18 26 18 26S36 29.25 36 18C36 8.059 27.941 0 18 0z" fill="${c}" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <polygon points="18,7 28,16 25,16 25,27 20,27 20,21 16,21 16,27 11,27 11,16 8,16" fill="white"/>
  </svg>`;
  const imgSrc = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  const img = new kakao.maps.MarkerImage(imgSrc, new kakao.maps.Size(36,44), { offset: new kakao.maps.Point(18,44) });
  const marker = new kakao.maps.Marker({ position:latlng, map:kakaoMap, image:img, title:item.name });
  kakao.maps.event.addListener(marker, 'click', () => {
    infowindow.setContent(buildPopup(item, year));
    infowindow.open(kakaoMap, marker);
    highlightProject(item.id);
  });
  allMarkers.push({ id:item.id, marker });
  item._marker = marker; item._latlng = latlng;
}

function buildPopup(item, year) {
  const c = YCLR[year]||'#E8001D';
  return `<div style="padding:12px 14px;min-width:210px;max-width:260px;font-family:Pretendard,sans-serif;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <div style="width:10px;height:10px;border-radius:50%;background:${c};flex-shrink:0;"></div>
      <strong style="font-size:13px;color:#1a1a2e;word-break:keep-all;">${item.name}</strong>
    </div>
    <div style="font-size:11px;color:#666;margin-bottom:2px;">${item.addr}</div>
    <div style="font-size:11px;color:#999;">${year}년 수주검토${item.memo?' · '+item.memo:''}</div>
  </div>`;
}

function focusProject(id, team, year) {
  const item = db[team]?.[year]?.find(i => i.id === id);
  if (!item || !item._latlng || !kakaoMap) return;
  kakaoMap.setCenter(item._latlng); kakaoMap.setLevel(4);
  if (item._marker) { infowindow.setContent(buildPopup(item,year)); infowindow.open(kakaoMap, item._marker); }
  highlightProject(id);
  openTeam = team; openYear = year; renderTree();
}

function highlightProject(id) {
  document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('pi-'+id);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
}

function updateStats() {
  let count = 0;
  TEAMS.forEach(t => YEARS.forEach(y => count += (db[t]?.[y]?.filter(i=>i.lat)||[]).length));
  document.getElementById('mapStat').textContent = `표시: ${count}건`;
}

function geocodeItem(item, year, cb) {
  if (!kakaoReady) { setTimeout(() => geocodeItem(item, year, cb), 500); return; }
  kakaoGeocoder.addressSearch(item.addr, (result, status) => {
    if (status === kakao.maps.services.Status.OK) {
      item.lat = parseFloat(result[0].y); item.lng = parseFloat(result[0].x);
      item._latlng = new kakao.maps.LatLng(item.lat, item.lng);
      placeMarker(item, year, item._latlng);
    }
    if (cb) cb(status === kakao.maps.services.Status.OK);
  });
}

function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '사업장 추가';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('f-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-addr').value = '';
  document.getElementById('f-memo').value = '';
  if (openTeam) document.getElementById('f-team').value = openTeam;
  selectYearVal(openYear || '2026');
  document.getElementById('modal').classList.add('show');
  setTimeout(() => document.getElementById('f-name').focus(), 100);
}

function openEdit(id, team, year) {
  const item = db[team]?.[year]?.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '사업장 수정';
  document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('f-id').value = id;
  document.getElementById('f-team').value = team;
  document.getElementById('f-name').value = item.name;
  document.getElementById('f-addr').value = item.addr;
  document.getElementById('f-memo').value = item.memo || '';
  selectYearVal(year);
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

function selectYear(el) {
  document.querySelectorAll('.year-pill').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('f-year').value = el.dataset.year;
}
function selectYearVal(y) {
  document.querySelectorAll('.year-pill').forEach(p => p.classList.toggle('selected', p.dataset.year === y));
  document.getElementById('f-year').value = y;
}

function submitModal() {
  const team = document.getElementById('f-team').value;
  const year = document.getElementById('f-year').value;
  const name = document.getElementById('f-name').value.trim();
  const addr = document.getElementById('f-addr').value.trim();
  const memo = document.getElementById('f-memo').value.trim();
  if (!name) { showToast('사업장명을 입력해주세요', 'err'); return; }
  if (!addr) { showToast('주소를 입력해주세요', 'err'); return; }
  if (editingId) {
    let oldTeam = null, oldYear = null, oldItem = null;
    TEAMS.forEach(t => YEARS.forEach(y => {
      const i = db[t]?.[y]?.find(x => x.id === editingId);
      if (i) { oldTeam=t; oldYear=y; oldItem=i; }
    }));
    if (oldItem) {
      if (oldItem._marker) oldItem._marker.setMap(null);
      if (oldTeam !== team || oldYear !== year) db[oldTeam][oldYear] = db[oldTeam][oldYear].filter(x => x.id !== editingId);
      const newItem = { ...oldItem, name, addr, memo, lat:null, lng:null, _marker:null, _latlng:null };
      if (oldTeam !== team || oldYear !== year) {
        if (!db[team]) db[team] = {};
        if (!db[team][year]) db[team][year] = [];
        db[team][year].push(newItem);
      } else {
        const idx = db[team][year].findIndex(x => x.id === editingId);
        if (idx >= 0) db[team][year][idx] = newItem;
      }
      geocodeItem(newItem, year, ok => { if (!ok) showToast('주소를 찾을 수 없습니다', 'err'); renderTree(); updateStats(); debounceSave(); });
    }
  } else {
    const item = { id: Date.now().toString(), name, addr, memo, lat:null, lng:null, _marker:null, _latlng:null };
    if (!db[team]) db[team] = {};
    if (!db[team][year]) db[team][year] = [];
    db[team][year].push(item);
    openTeam = team; openYear = year;
    geocodeItem(item, year, ok => {
      if (ok) { kakaoMap.setCenter(item._latlng); kakaoMap.setLevel(5); showToast(`"${name}" 추가됨 ✓`, 'ok'); }
      else showToast('주소를 찾을 수 없습니다', 'err');
      renderTree(); updateStats(); debounceSave();
    });
  }
  closeModal(); renderTree();
}

function deleteFromModal() {
  if (!editingId) return;
  TEAMS.forEach(t => YEARS.forEach(y => {
    const idx = db[t]?.[y]?.findIndex(x => x.id === editingId);
    if (idx >= 0) { if (db[t][y][idx]._marker) db[t][y][idx]._marker.setMap(null); db[t][y].splice(idx, 1); }
  }));
  closeModal(); renderTree(); updateStats(); debounceSave();
  showToast('삭제됐습니다', 'ok');
}

function deleteProject(id, team, year) {
  const idx = db[team]?.[year]?.findIndex(i => i.id === id);
  if (idx < 0) return;
  if (db[team][year][idx]._marker) db[team][year][idx]._marker.setMap(null);
  db[team][year].splice(idx, 1);
  renderTree(); updateStats(); debounceSave();
  showToast('삭제됐습니다', 'ok');
}

function clearAll() {
  if (!confirm('모든 데이터를 삭제할까요?')) return;
  allMarkers.forEach(m => m.marker && m.marker.setMap(null));
  allMarkers = []; db = emptyDb();
  renderTree(); updateStats(); saveDb();
  showToast('전체 삭제됐습니다', 'ok');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast '+type+' show';
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
</script>
</body>
</html>
