<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주택본부 수주검토 사업장 현황</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#242A5C;--navy2:#1a1f42;--navy3:#2e3570;
  --orange:#F47F3F;--bg:#f0f4fb;--surface:#fff;--surface2:#f0f4ff;
  --border:#dde3f0;--border2:#c8d0e8;
  --text:#1a1a2e;--text2:#4a5080;--text3:#8890b0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:#fff;border-bottom:3px solid var(--navy);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(36,42,92,0.08);}
.header-inner{height:66px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:16px;}
.kumho-logo{height:30px;object-fit:contain;}
.hdiv{width:1px;height:32px;background:#ddd;}
.header-title{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-0.4px;}
.header-right{display:flex;align-items:center;gap:8px;}
.save-badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text2);background:var(--surface2);}
.save-badge.ok{color:#2a7d4f;border-color:rgba(42,125,79,0.3);background:rgba(42,125,79,0.08);}
.save-badge.saving{color:#d29922;border-color:rgba(210,153,34,0.3);}
.app{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 69px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.search-area{padding:10px;border-bottom:1px solid var(--border);position:relative;}
.search-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:8px 12px;border-radius:8px;outline:none;transition:all 0.15s;}
.search-input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,42,92,0.08);}
.search-input::placeholder{color:var(--text3);}
.search-results{position:absolute;top:calc(100% - 2px);left:10px;right:10px;background:var(--surface);border:1.5px solid var(--border);border-radius:0 0 8px 8px;z-index:200;max-height:260px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(36,42,92,0.1);}
.search-results.show{display:block;}
.search-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s;}
.search-item:last-child{border-bottom:none;}
.search-item:hover{background:var(--surface2);}
.si-name{font-size:12px;font-weight:600;color:var(--text);}
.si-meta{font-size:11px;color:var(--text2);margin-top:1px;}
.si-addr{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.upload-area{padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;gap:8px;}
.upload-btn{flex:1;padding:7px;border-radius:7px;border:1.5px dashed var(--border2);background:transparent;color:var(--text2);font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:center;position:relative;overflow:hidden;}
.upload-btn:hover{border-color:var(--navy);color:var(--navy);background:rgba(36,42,92,0.04);}
.upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.tmpl-btn{flex:1;padding:7px;border-radius:7px;border:1.5px solid var(--orange);background:transparent;color:var(--orange);font-size:11px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;}
.tmpl-btn:hover{background:var(--orange);color:#fff;}
.tree-nav{flex:1;overflow-y:auto;padding:6px 0;}
.tree-nav::-webkit-scrollbar{width:3px;}
.tree-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.reg-sec{margin-bottom:1px;}
.reg-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;transition:background 0.1s;border-radius:6px;margin:0 4px;}
.reg-hdr:hover{background:var(--surface2);}
.reg-hdr.active{background:rgba(36,42,92,0.07);border-left:2px solid var(--navy);}
.reg-name{font-size:13px;font-weight:600;color:var(--text);}
.reg-cnt{font-size:11px;color:var(--text3);background:var(--surface2);padding:1px 7px;border-radius:10px;border:1px solid var(--border);}
.reg-chev{font-size:10px;color:var(--text3);transition:transform 0.2s;}
.reg-chev.open{transform:rotate(90deg);}
.sub-list{display:none;padding:0 4px 2px;}
.sub-list.open{display:block;}
.sub-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;cursor:pointer;border-radius:6px;transition:background 0.1s;}
.sub-hdr:hover{background:var(--surface2);}
.sub-hdr.active{background:rgba(244,127,63,0.07);}
.sub-name{font-size:12px;font-weight:500;color:var(--text2);}
.sub-cnt{font-size:10px;color:var(--text3);background:var(--surface2);padding:1px 6px;border-radius:8px;}
.proj-list{display:none;padding:0 4px 2px;}
.proj-list.open{display:block;}
.proj-item{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;cursor:pointer;border-radius:6px;transition:background 0.1s;border:1px solid transparent;margin-bottom:1px;}
.proj-item:hover{background:var(--surface2);border-color:var(--border);}
.proj-item.active{background:rgba(36,42,92,0.06);border-color:rgba(36,42,92,0.2);}
.proj-yr{font-size:10px;font-weight:700;padding:2px 5px;border-radius:4px;flex-shrink:0;margin-top:1px;}
.y2026{background:rgba(232,0,29,0.1);color:#c00;}
.y2025{background:rgba(244,127,63,0.15);color:#c05010;}
.y2024{background:rgba(42,157,92,0.12);color:#1a6b3a;}
.proj-info{flex:1;min-width:0;}
.proj-name{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;}
.proj-addr{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.proj-acts{display:flex;gap:3px;opacity:0;transition:opacity 0.15s;flex-shrink:0;}
.proj-item:hover .proj-acts{opacity:1;}
.icon-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.icon-btn:hover{border-color:var(--navy);color:var(--navy);}
.icon-btn.del:hover{border-color:#f85149;color:#f85149;}
.sidebar-bottom{border-top:1px solid var(--border);padding:10px;}
.add-btn{width:100%;padding:10px;border-radius:8px;border:none;background:var(--navy);color:#fff;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;}
.add-btn:hover{background:var(--navy3);}
.map-area{position:relative;overflow:hidden;}
#map{width:100%;height:100%;min-height:400px;}
.map-overlay{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10;transition:opacity 0.3s;}
.map-overlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay-text{font-size:13px;color:var(--text2);font-weight:500;}
.map-legend{position:absolute;bottom:20px;right:16px;background:rgba(255,255,255,0.96);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:11px;color:var(--text2);z-index:5;box-shadow:0 4px 16px rgba(36,42,92,0.1);}
.leg-title{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:8px;}
.leg-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.leg-row:last-child{margin-bottom:0;}
.leg-dot{width:10px;height:10px;border-radius:50%;}
.map-stat{font-size:11px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-backdrop.show{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:14px;padding:26px;width:520px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(36,42,92,0.18);}
.modal-title{font-size:17px;font-weight:700;color:var(--navy);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
.form-row{display:flex;flex-direction:column;gap:5px;}
.form-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.4px;}
.req{color:var(--orange);}
input[type="text"],input[type="date"],select{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);font-family:'Pretendard',sans-serif;font-size:13px;padding:8px 11px;border-radius:8px;outline:none;width:100%;transition:all 0.15s;}
input:focus,select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(36,42,92,0.08);}
.year-pills{display:flex;gap:6px;}
.year-pill{flex:1;padding:7px 0;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-size:12px;font-family:inherit;font-weight:700;cursor:pointer;text-align:center;transition:all 0.15s;color:var(--text2);}
.year-pill[data-year="2026"].selected{background:rgba(200,0,29,0.08);border-color:#c0001d;color:#c0001d;}
.year-pill[data-year="2025"].selected{background:rgba(244,127,63,0.1);border-color:var(--orange);color:var(--orange);}
.year-pill[data-year="2024"].selected{background:rgba(42,157,92,0.1);border-color:#2a9d5c;color:#2a9d5c;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:4px;border-top:1px solid var(--border);}
.btn{padding:9px 18px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;transition:all 0.15s;}
.btn:hover{border-color:var(--navy);color:var(--navy);}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy3);border-color:var(--navy3);color:#fff;}
.btn-danger{color:#f85149;border-color:#f85149;}
.btn-danger:hover{background:rgba(248,81,73,0.07);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);border-radius:10px;padding:10px 18px;font-size:13px;color:#fff;z-index:9999;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;box-shadow:0 8px 24px rgba(36,42,92,0.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.ok{background:#2a7d4f;}
.toast.err{background:#c0392b;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
@media(max-width:768px){.app{grid-template-columns:1fr;}.sidebar{max-height:45vh;}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <img class="kumho-logo" src="kumho_logo.jpg">
      <div class="hdiv"></div>
      <div class="header-title">주택본부 수주검토 사업장 현황</div>
    </div>
    <div class="header-right">
      <span class="save-badge" id="saveBadge">로딩 중...</span>
      <button class="btn" style="font-size:11px;padding:5px 10px;" onclick="goHome()">🏠 홈</button>
      <button class="btn" style="font-size:11px;padding:5px 10px;color:#f85149;border-color:#f85149;" onclick="clearAll()">전체삭제</button>
    </div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="search-area">
      <input class="search-input" type="text" id="searchInput" placeholder="🔍  사업장명, 주소, 정보제공자 검색..." oninput="onSearch(this.value)" onblur="setTimeout(()=>hideSearch(),200)">
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="upload-area">
      <label class="upload-btn">📂 엑셀 업로드<input type="file" accept=".xlsx,.xls,.csv" onchange="handleFile(event)"></label>
      <button class="tmpl-btn" onclick="downloadTemplate()">⬇ 양식 다운로드</button>
    </div>
    <div class="tree-nav" id="treeNav"></div>
    <div class="sidebar-bottom">
      <button class="add-btn" onclick="openAdd()">＋ 사업장 추가</button>
    </div>
  </aside>

  <main class="map-area">
    <div id="mapOverlay" class="map-overlay">
      <div class="spinner"></div>
      <div class="overlay-text">지도 로딩 중...</div>
    </div>
    <div id="map"></div>
    <div class="map-legend" id="mapLegend" style="display:none;">
      <div class="leg-title">연도별 구분</div>
      <div class="leg-row"><div class="leg-dot" style="background:#c0001d"></div><span>2026년</span></div>
      <div class="leg-row"><div class="leg-dot" style="background:#F47F3F"></div><span>2025년</span></div>
      <div class="leg-row"><div class="leg-dot" style="background:#2a9d5c"></div><span>2024년</span></div>
      <div class="map-stat" id="mapStat">표시: 0건</div>
    </div>
  </main>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">사업장 추가</div>
    <input type="hidden" id="f-id">
    <div class="form-grid">
      <div class="form-row full"><label class="form-label">사업장명 <span class="req">*</span></label><input type="text" id="f-name" placeholder="예: 서울 강남구 개포동 재건축"></div>
      <div class="form-row full"><label class="form-label">주소 <span class="req">*</span></label><input type="text" id="f-addr" placeholder="예: 서울 강남구 개포동 123"></div>
      <div class="form-row full">
        <label class="form-label">연도 <span class="req">*</span></label>
        <div class="year-pills">
          <button class="year-pill selected" data-year="2026" onclick="selectYear(this)">2026</button>
          <button class="year-pill" data-year="2025" onclick="selectYear(this)">2025</button>
          <button class="year-pill" data-year="2024" onclick="selectYear(this)">2024</button>
        </div>
        <input type="hidden" id="f-year" value="2026">
      </div>
      <div class="form-row"><label class="form-label">정보제공자</label><input type="text" id="f-provider" placeholder="이름"></div>
      <div class="form-row"><label class="form-label">검토일자</label><input type="date" id="f-date"></div>
      <div class="form-row"><label class="form-label">대지면적 (㎡)</label><input type="text" id="f-site" placeholder="예: 5,230"></div>
      <div class="form-row"><label class="form-label">연면적 (㎡)</label><input type="text" id="f-floor" placeholder="예: 45,600"></div>
      <div class="form-row"><label class="form-label">층수</label><input type="text" id="f-floors" placeholder="예: 35"></div>
      <div class="form-row"><label class="form-label">세대수</label><input type="text" id="f-units" placeholder="예: 420"></div>
      <div class="form-row full"><label class="form-label">비고</label><input type="text" id="f-memo" placeholder="투기과열지구, 역세권 등"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;margin-right:auto;" onclick="deleteFromModal()">삭제</button>
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" onclick="submitModal()">저장</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

const REGION_MAP = [
  ['서울','서울특별시'],['부산','부산광역시'],['대구','대구광역시'],
  ['인천','인천광역시'],['광주','광주광역시'],['대전','대전광역시'],

  ['경기','경기도'],['강원','강원도'],
  ['충북','충청북도'],['충청북','충청북도'],['충청북도','충청북도'],
  ['충남','충청남도'],['충청남','충청남도'],['충청남도','충청남도'],

  ['제주','제주특별자치도'],
];
const REGION_ORDER = ['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시','세종특별자치시','경기도','강원도','충청북도','충청남도','전라북도','전라남도','경상북도','경상남도','제주특별자치도'];

function getRegion(addr) {
  for (const [key, val] of REGION_MAP) {
    if (addr.startsWith(key)) return val;
  }
  return '기타';
}
function getSubregion(addr) {
  const parts = addr.trim().split(/\s+/);
  return parts.length > 1 ? parts[1] : '';
}

let db = [], allMarkers = [];
let kakaoMap = null, kakaoGeocoder = null, infowindow = null, kakaoReady = false;
let saveTimer = null, editingId = null, openRegion = null, openSub = null;

window.addEventListener('load', async () => { loadKakao(); await loadDb(); });

function loadKakao() {
  const s = document.createElement('script');
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_KEY}&libraries=services&autoload=false`;
  s.onload = () => kakao.maps.load(() => {
    kakaoReady = true;
    kakaoMap = new kakao.maps.Map(document.getElementById('map'), {center:new kakao.maps.LatLng(36.5,127.5),level:12});
    kakaoGeocoder = new kakao.maps.services.Geocoder();
    infowindow = new kakao.maps.InfoWindow({zIndex:1});
    document.getElementById('mapOverlay').classList.add('hidden');
    document.getElementById('mapLegend').style.display = 'block';
    restoreMarkers();
  });
  document.head.appendChild(s);
}

async function loadDb() {
  try {
    const res = await fetch(DB_URL + '.json');
    const rec = await res.json();
    db = (rec && rec.projects && Array.isArray(rec.projects)) ? rec.projects.map(i => ({...i,_marker:null,_latlng:null})) : [];
  } catch(e) { db = []; }
  renderTree();
  setSaveBadge('ok','동기화됨');
}

async function saveDb() {
  setSaveBadge('saving','저장 중...');
  try {
    const clean = db.map(({id,name,addr,year,region,subregion,provider,date,site,floor,floors,units,memo,lat,lng}) =>
      ({id,name,addr,year,region:region||'',subregion:subregion||'',provider:provider||'',date:date||'',site:site||'',floor:floor||'',floors:floors||'',units:units||'',memo:memo||'',lat:lat||null,lng:lng||null}));
    const res = await fetch(DB_URL+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({projects:clean})});
    if(!res.ok) throw new Error(res.status);
    setSaveBadge('ok','저장됨 ✓');
  } catch(e) { setSaveBadge('','저장 실패'); }
}

function debounceSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDb,1200); }
function setSaveBadge(cls,txt) {
  const b = document.getElementById('saveBadge');
  b.className = 'save-badge'+(cls?' '+cls:'');
  b.textContent = txt;
}

// ── 트리 ──────────────────────────────────────────────────────────────────
function getTree() {
  const t = {};
  db.forEach(item => {
    const r = item.region||'기타', s = item.subregion||'기타';
    if(!t[r]) t[r]={};
    if(!t[r][s]) t[r][s]=[];
    t[r][s].push(item);
  });
  return t;
}

function renderTree() {
  const nav = document.getElementById('treeNav');
  nav.innerHTML = '';
  const tree = getTree();
  const regions = Object.keys(tree).sort((a,b) => {
    const ai=REGION_ORDER.indexOf(a), bi=REGION_ORDER.indexOf(b);
    if(ai===-1&&bi===-1) return a.localeCompare(b,'ko');
    if(ai===-1) return 1; if(bi===-1) return -1;
    return ai-bi;
  });
  if(!regions.length) {
    nav.innerHTML='<div style="padding:20px 14px;font-size:12px;color:var(--text3);text-align:center;">등록된 사업장이 없습니다</div>';
    updateStats(); return;
  }
  regions.forEach(region => {
    const subs = tree[region];
    const total = Object.values(subs).reduce((s,a)=>s+a.length,0);
    const isOpen = openRegion===region;
    const sec = document.createElement('div');
    sec.className='reg-sec';
    let subsHtml='';
    Object.keys(subs).sort((a,b)=>a.localeCompare(b,'ko')).forEach(sub => {
      const items=subs[sub], isSubOpen=isOpen&&openSub===sub;
      subsHtml+=`<div>
        <div class="sub-hdr${isSubOpen?' active':''}" onclick="toggleSub('${region}','${sub}')">
          <span class="sub-name">${sub}</span><span class="sub-cnt">${items.length}</span>
        </div>
        <div class="proj-list${isSubOpen?' open':''}" id="pl-${esc(region+sub)}">
          ${items.map(item=>projHtml(item)).join('')}
        </div></div>`;
    });
    sec.innerHTML=`
      <div class="reg-hdr${isOpen?' active':''}" onclick="toggleReg('${region}')">
        <span class="reg-name">${region}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="reg-cnt">${total}</span>
          <span class="reg-chev${isOpen?' open':''}">▶</span>
        </div>
      </div>
      <div class="sub-list${isOpen?' open':''}">${subsHtml}</div>`;
    nav.appendChild(sec);
  });
  updateStats();
}

function projHtml(item) {
  const yc=item.year==='2026'?'y2026':item.year==='2025'?'y2025':'y2024';
  return `<div class="proj-item" id="pi-${item.id}" onclick="focusProj('${item.id}')">
    <div class="proj-yr ${yc}">${item.year}</div>
    <div class="proj-info">
      <div class="proj-name">${item.name}</div>
      <div class="proj-addr">${item.addr}</div>
    </div>
    <div class="proj-acts">
      <button class="icon-btn" onclick="event.stopPropagation();openEdit('${item.id}')" title="수정">✏</button>
      <button class="icon-btn del" onclick="event.stopPropagation();deleteItem('${item.id}')" title="삭제">✕</button>
    </div>
  </div>`;
}

function esc(s) { return s.replace(/[^a-zA-Z0-9가-힣]/g,'_'); }
function toggleReg(r) { openRegion=openRegion===r?null:r; if(openRegion!==r) openSub=null; renderTree(); }
function toggleSub(r,s) {
  if(openRegion!==r) openRegion=r;
  openSub=(openRegion===r&&openSub===s)?null:s;
  renderTree();
  if(openSub) {
    const items=(getTree()[r]||{})[s]||[];
    if(items.length&&kakaoReady) {
      const bounds=new kakao.maps.LatLngBounds();
      let cnt=0;
      items.forEach(i=>{ if(i.lat&&i.lng){ bounds.extend(new kakao.maps.LatLng(i.lat,i.lng)); cnt++; } });
      if(cnt>0) kakaoMap.setBounds(bounds);
    }
  }
}

// ── 마커 ──────────────────────────────────────────────────────────────────
function clearMarkers() { allMarkers.forEach(m=>m&&m.setMap&&m.setMap(null)); allMarkers=[]; }

function restoreMarkers() {
  if(!kakaoReady) return;
  clearMarkers();
  const bounds=new kakao.maps.LatLngBounds();
  let cnt=0;
  db.forEach(item => {
    if(item.lat&&item.lng) {
      const ll=new kakao.maps.LatLng(item.lat,item.lng);
      item._latlng=ll;
      placeMarker(item,ll);
      bounds.extend(ll); cnt++;
    }
  });
  if(cnt>0) kakaoMap.setBounds(bounds);
  updateStats();
}

function placeMarker(item, latlng) {
  // 기존 마커 제거 (중복 방지)
  if(item._marker) { item._marker.setMap(null); item._marker=null; }
  const c = YCLR[item.year]||'#242A5C';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
    <path d="M16 1C8.268 1 2 7.268 2 15c0 9.5 14 24 14 24S30 24.5 30 15C30 7.268 23.732 1 16 1z" fill="${c}" stroke="white" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="11" fill="white" opacity="0.15"/>
    <polygon points="16,5 23,13 20.5,13 20.5,22 11.5,22 11.5,13 9,13" fill="white"/>
    <rect x="13" y="17" width="6" height="5" fill="${c}"/>
  </svg>`;
  const imgSrc = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  const img = new kakao.maps.MarkerImage(imgSrc, new kakao.maps.Size(32,40), {offset:new kakao.maps.Point(16,40)});
  const marker = new kakao.maps.Marker({position:latlng,map:kakaoMap,image:img,title:item.name});
  kakao.maps.event.addListener(marker,'click',()=>{
    infowindow.setContent(buildPopup(item));
    infowindow.open(kakaoMap,marker);
    highlightItem(item.id);
  });
  allMarkers.push(marker);
  item._marker=marker;
  item._latlng=latlng;
}

function buildPopup(item) {
  const c=YCLR[item.year]||'#242A5C';
  const rows=[
    item.provider?`<div>👤 ${item.provider}</div>`:'',
    item.date?`<div>📅 ${item.date}</div>`:'',
    item.site?`<div>🏗 대지 ${item.site}㎡</div>`:'',
    item.floor?`<div>📐 연면적 ${item.floor}㎡</div>`:'',
    item.floors?`<div>🏢 ${item.floors}층</div>`:'',
    item.units?`<div>🏠 ${item.units}세대</div>`:'',
  ].filter(Boolean).join('');
  return `<div style="padding:13px 15px;min-width:230px;max-width:280px;font-family:Pretendard,sans-serif;">
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px;">
      <div style="width:9px;height:9px;border-radius:50%;background:${c};flex-shrink:0;"></div>
      <strong style="font-size:13px;color:#1a1a2e;word-break:keep-all;">${item.name}</strong>
    </div>
    <div style="font-size:11px;color:#555;margin-bottom:${rows?'7':'0'}px;">${item.addr}</div>
    ${rows?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:11px;color:#666;">${rows}</div>`:''}
    ${item.memo?`<div style="font-size:11px;color:#888;margin-top:6px;padding-top:5px;border-top:1px solid #eee;">${item.memo}</div>`:''}
    <div style="font-size:10px;color:#aaa;margin-top:5px;">${item.year}년 수주검토</div>
  </div>`;
}

function focusProj(id) {
  const item=db.find(i=>i.id===id);
  if(!item||!item._latlng||!kakaoMap) return;
  kakaoMap.setCenter(item._latlng); kakaoMap.setLevel(4);
  if(item._marker) { infowindow.setContent(buildPopup(item)); infowindow.open(kakaoMap,item._marker); }
  highlightItem(id);
}

function highlightItem(id) {
  document.querySelectorAll('.proj-item').forEach(el=>el.classList.remove('active'));
  const el=document.getElementById('pi-'+id);
  if(el) { el.classList.add('active'); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

function updateStats() {
  const cnt=db.filter(i=>i.lat).length;
  const el=document.getElementById('mapStat');
  if(el) el.textContent=`표시: ${cnt}건`;
}

// ── 검색 (정보제공자 포함) ────────────────────────────────────────────────
function onSearch(q) {
  const box=document.getElementById('searchResults');
  if(!q.trim()) { box.classList.remove('show'); return; }
  const kw=q.toLowerCase();
  const results=db.filter(item=>
    item.name.toLowerCase().includes(kw)||
    item.addr.toLowerCase().includes(kw)||
    (item.region||'').toLowerCase().includes(kw)||
    (item.subregion||'').toLowerCase().includes(kw)||
    (item.provider||'').toLowerCase().includes(kw)||
    (item.memo||'').toLowerCase().includes(kw)
  );
  if(!results.length) {
    box.innerHTML='<div style="padding:12px;font-size:12px;color:var(--text3);text-align:center;">검색 결과 없음</div>';
    box.classList.add('show'); return;
  }
  box.innerHTML=results.slice(0,20).map(item=>`
    <div class="search-item" onmousedown="selectSearch('${item.id}')">
      <div class="si-name">${item.name}</div>
      <div class="si-meta">${item.region||''} ${item.subregion||''} · ${item.year}년${item.provider?' · '+item.provider:''}</div>
      <div class="si-addr">${item.addr}</div>
    </div>`).join('');
  box.classList.add('show');
}
function hideSearch() { document.getElementById('searchResults').classList.remove('show'); }
function selectSearch(id) { document.getElementById('searchInput').value=''; hideSearch(); focusProj(id); }

// ── 엑셀 ─────────────────────────────────────────────────────────────────
function handleFile(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try {
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      let added=0;
      rows.forEach(row=>{
        const keys = Object.keys(row);
        const findKey = (candidates) => keys.find(k => candidates.some(c => k.replace(/[*\s]/g,'').toLowerCase() === c.toLowerCase())) || null;
        const getVal = (candidates, def='') => { const k=findKey(candidates); return k ? String(row[k]||def).trim() : def; };
        const name=getVal(['사업장명','사업장이름','name']);
        const addr=getVal(['주소','address','addr','도로명주소','지번주소']);
        const year=getVal(['연도','year'],'2026');
        if(!name||!addr) return;
        const rawRegion=getVal(['시/도','시도','region','광역시도']);
        const rawSub=getVal(['시/군/구','시군구','subregion','구시군']);
        const item={
          id:Date.now().toString()+Math.random().toString(36).slice(2),
          name,addr,
          year:['2026','2025','2024'].includes(year)?year:'2026',
          region:rawRegion||getRegion(addr),
          subregion:rawSub||getSubregion(addr),
          provider:getVal(['정보제공자','제공자','provider']),
          date:getVal(['검토일자','일자','date']),
          site:getVal(['대지면적','대지','site']),
          floor:getVal(['연면적','연','floor']),
          floors:getVal(['층수','층','floors']),
          units:getVal(['세대수','세대','units']),
          memo:getVal(['비고','메모','memo','note']),
          lat:null,lng:null,_marker:null,_latlng:null
        };
        db.push(item); added++;
        geocodeItem(item);
      });
      renderTree(); debounceSave();
      showToast(`${added}건 업로드됨`,'ok');
    } catch(err) { showToast('파일 오류: '+err.message,'err'); }
  };
  reader.readAsArrayBuffer(file);
}
function downloadTemplate() { const a=document.createElement('a'); a.href=XLSX_TPL; a.download='수주검토_사업장_입력양식.xlsx'; a.click(); }

// ── 지오코딩 ──────────────────────────────────────────────────────────────
function geocodeItem(item,cb) {
  if(!kakaoReady) { setTimeout(()=>geocodeItem(item,cb),500); return; }
  kakaoGeocoder.addressSearch(item.addr,(result,status)=>{
    if(status===kakao.maps.services.Status.OK) {
      item.lat=parseFloat(result[0].y); item.lng=parseFloat(result[0].x);
      item._latlng=new kakao.maps.LatLng(item.lat,item.lng);
      placeMarker(item,item._latlng);
      updateStats();
    }
    if(cb) cb(status===kakao.maps.services.Status.OK);
  });
}

// ── 모달 ──────────────────────────────────────────────────────────────────
function openAdd() {
  editingId=null;
  document.getElementById('modalTitle').textContent='사업장 추가';
  document.getElementById('deleteBtn').style.display='none';
  ['f-id','f-name','f-addr','f-provider','f-date','f-site','f-floor','f-floors','f-units','f-memo'].forEach(id=>document.getElementById(id).value='');
  selectYearVal('2026');
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('f-name').focus(),100);
}

function openEdit(id) {
  const item=db.find(i=>i.id===id); if(!item) return;
  editingId=id;
  document.getElementById('modalTitle').textContent='사업장 수정';
  document.getElementById('deleteBtn').style.display='inline-flex';
  document.getElementById('f-id').value=id;
  document.getElementById('f-name').value=item.name||'';
  document.getElementById('f-addr').value=item.addr||'';
  document.getElementById('f-provider').value=item.provider||'';
  document.getElementById('f-date').value=item.date||'';
  document.getElementById('f-site').value=item.site||'';
  document.getElementById('f-floor').value=item.floor||'';
  document.getElementById('f-floors').value=item.floors||'';
  document.getElementById('f-units').value=item.units||'';
  document.getElementById('f-memo').value=item.memo||'';
  selectYearVal(item.year||'2026');
  document.getElementById('modal').classList.add('show');
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }
function selectYear(el) { document.querySelectorAll('.year-pill').forEach(p=>p.classList.remove('selected')); el.classList.add('selected'); document.getElementById('f-year').value=el.dataset.year; }
function selectYearVal(y) { document.querySelectorAll('.year-pill').forEach(p=>p.classList.toggle('selected',p.dataset.year===y)); document.getElementById('f-year').value=y; }

function submitModal() {
  const name=document.getElementById('f-name').value.trim();
  const addr=document.getElementById('f-addr').value.trim();
  const year=document.getElementById('f-year').value;
  if(!name) { showToast('사업장명을 입력해주세요','err'); return; }
  if(!addr) { showToast('주소를 입력해주세요','err'); return; }
  const region=getRegion(addr);
  const subregion=getSubregion(addr);
  if(editingId) {
    const idx=db.findIndex(i=>i.id===editingId);
    if(idx>=0) {
      if(db[idx]._marker) db[idx]._marker.setMap(null);
      db[idx]={...db[idx],name,addr,year,region,subregion,
        provider:document.getElementById('f-provider').value.trim(),
        date:document.getElementById('f-date').value,
        site:document.getElementById('f-site').value.trim(),
        floor:document.getElementById('f-floor').value.trim(),
        floors:document.getElementById('f-floors').value.trim(),
        units:document.getElementById('f-units').value.trim(),
        memo:document.getElementById('f-memo').value.trim(),
        lat:null,lng:null,_marker:null,_latlng:null
      };
      geocodeItem(db[idx],ok=>{ renderTree(); debounceSave(); });
    }
  } else {
    const item={
      id:Date.now().toString(),name,addr,year,region,subregion,
      provider:document.getElementById('f-provider').value.trim(),
      date:document.getElementById('f-date').value,
      site:document.getElementById('f-site').value.trim(),
      floor:document.getElementById('f-floor').value.trim(),
      floors:document.getElementById('f-floors').value.trim(),
      units:document.getElementById('f-units').value.trim(),
      memo:document.getElementById('f-memo').value.trim(),
      lat:null,lng:null,_marker:null,_latlng:null
    };
    db.push(item);
    geocodeItem(item,ok=>{
      if(ok) { kakaoMap.setCenter(item._latlng); kakaoMap.setLevel(5); showToast(`"${name}" 추가됨 ✓`,'ok'); }
      else showToast('주소를 찾을 수 없습니다','err');
      renderTree(); debounceSave();
    });
  }
  closeModal(); renderTree();
}

function deleteFromModal() { if(!editingId) return; deleteItem(editingId); closeModal(); }
function deleteItem(id) {
  const idx=db.findIndex(i=>i.id===id); if(idx<0) return;
  if(db[idx]._marker) db[idx]._marker.setMap(null);
  db.splice(idx,1);
  renderTree(); updateStats(); debounceSave();
  showToast('삭제됐습니다','ok');
}
function goHome() {
  if(infowindow) infowindow.close();
  openRegion=null; openSub=null;
  renderTree();
  if(kakaoReady && db.length > 0) {
    const bounds = new kakao.maps.LatLngBounds();
    let cnt=0;
    db.forEach(i=>{ if(i.lat&&i.lng){ bounds.extend(new kakao.maps.LatLng(i.lat,i.lng)); cnt++; }});
    if(cnt>0) kakaoMap.setBounds(bounds);
    else kakaoMap.setCenter(new kakao.maps.LatLng(36.5,127.5)), kakaoMap.setLevel(12);
  } else if(kakaoReady) {
    kakaoMap.setCenter(new kakao.maps.LatLng(36.5,127.5));
    kakaoMap.setLevel(12);
  }
}

function clearAll() {
  if(!confirm('모든 데이터를 삭제할까요?')) return;
  db.forEach(i=>{ if(i._marker) i._marker.setMap(null); });
  db=[]; renderTree(); updateStats(); saveDb();
  showToast('전체 삭제됐습니다','ok');
}
function showToast(msg,type='') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2500);
}
document.getElementById('modal').addEventListener('click',e=>{ if(e.target===document.getElementById('modal')) closeModal(); });
</script>
